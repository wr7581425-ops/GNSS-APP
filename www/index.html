img{max-width:100%}

</head>
<body>
<title>WA Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de campo em uma coluna, barra de status no topo, navegação embaixo. Tema escuro único por escolha (leitura no sol). */
:root{
  --bg:#0F1720; --panel:#17212C; --panel2:#131C26; --line:#263241; --fg:#E8EEF4; --muted:#9FB0C2;
  --accent:#FF8A1F; --accent-ink:#1A0E02; --accent-bg:#2A1A0A; --fix:#3DDC84; --fix-bg:#12301F; --float:#FFC24B; --float-bg:#33270A; --bad:#FF6B5E; --bad-bg:#3A1512;
  --ui:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--ui)}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ttl{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.c-fix{color:var(--fix);background:var(--fix-bg)}.c-float{color:var(--float);background:var(--float-bg)}.c-off{color:var(--muted);background:var(--panel)}.c-bad{color:var(--bad);background:var(--bad-bg)}
#mapBox .minfo{position:absolute;left:8px;top:8px;right:44px;display:flex;gap:10px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(10,17,24,.82);font-size:12px;pointer-events:none}
#mapBox .mtools{position:absolute;left:8px;top:52px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px;max-height:calc(100% - 60px)}
.mtb{width:42px;height:42px;min-height:42px;padding:0;border-radius:10px;background:rgba(15,23,32,.88);border:1px solid var(--line);color:var(--fg);display:flex;align-items:center;justify-content:center}
.mtb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#mapBox .mfab{position:absolute;right:12px;bottom:34px;width:72px;height:72px;min-height:72px;border-radius:50%;padding:0;background:var(--accent);color:var(--accent-ink);border:3px solid #fff3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:800;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#mapBox .mfab:disabled{background:#3a4654;color:#9FB0C2}
#mapBox .mrapida{position:absolute;left:8px;right:8px;bottom:8px;padding:12px;border-radius:12px;background:rgba(19,28,38,.97);border:1px solid var(--line)}
.mbar{display:grid;grid-template-columns:auto 1fr 1.4fr;gap:8px;align-items:end;margin-top:-4px}
.mbar .mchip{display:flex;align-items:center;gap:4px;height:46px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.mbar .mchip input{width:58px;height:40px;border:0;background:transparent;padding:0;font-size:15px}
.mbar .mfld{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.mbar .mfld input{height:46px}
main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border:2px solid var(--accent)}
.card h3{margin:0;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ring{width:84px;height:84px;flex:0 0 84px;border-radius:50%;border:6px solid var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:21px}.ring small{font-size:11px;color:var(--muted)}
.coords{display:grid;grid-template-columns:26px 1fr;row-gap:6px;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.coords i{font-style:normal;color:var(--accent);font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:600 16px var(--ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;height:46px;padding:0 12px;width:100%;min-width:0}
input.m,.m{font-family:var(--mono)}
input[type=checkbox]{width:22px;height:22px;height:22px;accent-color:var(--accent);padding:0}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fg)}
button{font:700 16px var(--ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:0 14px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.big{min-height:64px;font-size:20px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px}
.opt small{font-size:12px;font-weight:500;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-bg)}
.opt[aria-pressed="true"] small{color:#FFB066}
.subtabs{display:flex;gap:6px;overflow-x:auto}
.subtabs button{min-height:40px;font-size:14px;font-weight:600;flex:0 0 auto}
.subtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel2);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom button{border:0;border-radius:0;background:transparent;color:var(--muted);font-size:13px;padding:0 2px;font-weight:600;min-height:58px}
nav.bottom button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.bottom button{min-height:62px!important;font-size:12px!important}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.row:last-child{border-bottom:0}
.muted{color:var(--muted)}.small{font-size:13px}
.st-fix{color:var(--fix);font-weight:700}.st-float{color:var(--float);font-weight:700}
.monitor{background:#0A1118;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 11px/1.6 var(--mono);color:#8FD6A8;height:120px;overflow:auto;white-space:pre}
.proj{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px 16px;font-weight:500}
.proj[aria-pressed="true"]{border:2px solid var(--accent)}
textarea{width:100%;min-height:150px;background:#0A1118;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:500 12px var(--mono)}
.banner{background:var(--float-bg);border:1px solid var(--float);color:#FFE3A3;border-radius:10px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:recpulso 1.2s infinite}@keyframes recpulso{0%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}#hRec[hidden]{display:none!important}
</style>

  <main id="view"></main>

  <nav class="bottom" aria-label="Navegação principal">
    <button type="button" data-aba="projeto" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Projeto</button>

    <button type="button" data-aba="levantamento" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Levantamento</button>
    <button type="button" data-aba="ferramentas" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Ferramentas</button>
  </nav>
</div>

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {

			}
		}
	}

function bip(tipo){

  if(c.vibrar)vib(tipo==="ok"?[60,60,60]:tipo==="erro"?[300]:tipo==="ganhouFix"?[80,60,80,60,200]:tipo==="float"?[120,100,120]:[150,80,150]);
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
    const notas=tipo==="ok"?[[1320,0,.09],[1760,.13,.12]]:tipo==="erro"?[[330,0,.35]]
      :tipo==="ganhouFix"?[[1047,0,.1],[1319,.12,.1],[1568,.24,.22]]   // sobe: ganhou FIX
      :tipo==="float"?[[880,0,.14],[880,.22,.14]]                     // dois toques iguais: flutuante

function avisoSolucao(){

  if(n===G.solAtual){G.solCand=n;G.solN=0;return}
  if(n!==G.solCand){G.solCand=n;G.solN=1;return}
  if(++G.solN<2)return;
  const ant=G.solAtual;G.solAtual=n;G.solN=0;
  if(baseTx())return; // como base o receptor fica autônomo de propósito: sem alarme de "perdeu o FIX"
  if(n==="fix"){bip("ganhouFix");toast("FIX!");falar("Fixo")}
  else if(n==="float"){bip("float");toast(ant==="fix"?"Atenção: perdeu o FIX (flutuante)":"Flutuante");falar("Flutuante")}

function dur(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,"0")).join(":")}

function stCls(){if(baseTx())return S.drLigado&&!((R.dr||{}).rtcmIdade>=0&&(R.dr||{}).rtcmIdade<5000)?"c-float":"c-fix";return !S.conectado?"c-off":G.fix===4?"c-fix":G.fix===5?"c-float":G.fix===1?"c-bad":"c-off"}

// numeração por obra: ao abrir a obra, continua do último ponto coletado + 1 (ex.: parou no 025 → 026)
function proxNome(){
  const pj=proj();if(pj&&pj.pNum)return pj.pNum;
  const pre=S.cfg.prefixo||"",pts=(proj()?.pontos||[]).filter(p=>p.st!=="CALC"&&p.st!=="PROJ");
  let max=0,larg=+S.cfg.digitos||2;
  for(const p of pts){const m=String(p.nome).match(/^(.*?)(\d+)$/);if(m&&m[1]===pre){if(+m[2]>max)max=+m[2];larg=Math.max(larg,m[2].length)}}
  return pre+String(max+1).padStart(larg,"0");
}
function incNome(n){const m=String(n).match(/^(.*?)(\d+)([^\d]*)$/);if(!m)return n+"-1";return m[1]+String(+m[2]+1).padStart(m[2].length,"0")+m[3]}
function rotulo(p){const r=S.cfg.rotuloMapa;return r==="nenhum"?"":r==="desc"?(p.cod||p.nome):r==="ambos"?(p.nome+(p.cod?" · "+p.cod:"")):p.nome}
function descRecentes(){const v=[];for(const p of [...(proj()?.pontos||[])].reverse()){if(p.cod&&!v.includes(p.cod)&&p.st!=="CALC")v.push(p.cod);if(v.length>=6)break}return v}
function alturaVertical(){
  const a=num(S.altura)||0,r=num(S.antRaio)||0,f=num(S.antFase)||0,t=S.altTipo||"vertical";
  if(t==="inclinada")return Math.sqrt(Math.max(0,a*a-r*r))+f;
  if(t==="fase")return a;
  return a+f;
}
function rnAtiva(){const r=proj()?.rn;return !!(r&&r.ativo)}
function rnOff(){const r=proj()?.rn;return r&&r.ativo?(+r.off||0):0}

// ---------- Ajustar base (PPP do IBGE + translação) ----------
const ESPERA_PPP=150; // minutos após o fim do rastreio (processamento GPS com órbitas ultrarrápidas)
function sAjuste(){
  const A=S.ajuste, now=Date.now();
  const net=`<label class="ck small"><input type="checkbox" id="semNet" ${S.semInternet?"checked":""}> Simular sem internet no local</label>`;
  if(!S.baseLigada&&!A) return `<section class="card"><h3>Ajuste de base no mesmo dia</h3>
    <span class="muted small">1. Em Base/Rover, pegue a <b>posição atual</b> da base e toque em Iniciar base. A gravação RINEX começa junto.<br>2. Colete normalmente com o rover.<br>3. Encerre o rastreio aqui: o app envia ao IBGE-PPP e, quando a coordenada corrigida chegar, aplica a correção na base e em todos os pontos do dia.</span>
    <button class="pri" data-sub="baserover">Ir para Base/Rover</button></section>
    ${manualAjuste()}`;
  if(A&&!A.prov&&A.status==="gravando") return `<section class="card"><h3>Base em coordenada conhecida</h3><span class="muted small">Esta base foi iniciada com ${esc(S.baseFonte||"coordenada digitada")}. Não precisa de ajuste. Se mesmo assim quiser conferir pelo IBGE, encerre o rastreio abaixo.</span>
    <button data-act="ajEncerrar">Encerrar rastreio e enviar ao IBGE-PPP</button></section>`;
  const prov=S.baseProv, nPts=pontosDesde(S.baseInicio).length;
  let corpo="";
  if(A.status==="gravando"){const t=(now-S.baseInicio)/1000,mb=t/15*7/1024;
    corpo=`<section class="card hl"><div class="split"><h3>Rastreando a base</h3><span class="st-fix small">● GRAVANDO</span></div>
      <div class="grid2"><div class="kv"><span>Tempo</span><b>${dur(t)}</b></div><div class="kv"><span>Arquivo RINEX (15 s)</span><b>${br(mb,2)} MB</b></div>
      <div class="kv"><span>Início</span><b>${hm(S.baseInicio)}</b></div><div class="kv"><span>Pontos coletados</span><b>${nPts}</b></div></div>
      ${t<3600?`<div class="banner">O IBGE recomenda pelo menos 1 hora de rastreio para precisão centimétrica. Faltam ${dur(3600-t)}.</div>`:`<span class="st-fix small">Tempo mínimo atingido.</span>`}
      <span class="muted small">Enquanto isso, faça só <b>coleta</b>. A locação deve esperar o ajuste.</span>
      ${net}
      <button class="pri" data-act="ajEncerrar">Encerrar rastreio e enviar ao IBGE-PPP</button></section>`}
  if(A.status==="fila") corpo=`<section class="card" style="border-color:var(--float)"><h3>Na fila de envio</h3>
      <span class="muted small">Rastreio encerrado às ${hm(A.fim)} (${dur((A.fim-S.baseInicio)/1000)}). Sem internet agora: o arquivo será enviado sozinho assim que o celular pegar sinal.</span>${net}</section>`;
  if(A.status==="aguardando"){const pronto=A.fim+ESPERA_PPP*60000,falta=(pronto-now)/1000;

        :`<span class="small">Deslocamento horizontal: <b>${br(Math.hypot(dE,dN))} m</b>. Ao aplicar, a base e os <b>${nPts} pontos</b> coletados desde ${hm(S.baseInicio)} são corrigidos, e a coordenada nova é enviada ao receptor da base.</span>

function nomeArq(n){return (n||"EST").replace(/[^A-Za-z0-9_-]/g,"").slice(0,16)||"EST"}
function antenaModelo(){const sr=R.serie||S.btNome||"";return /^T7/i.test(sr)?"T70(NGS)":/^S6/i.test(sr)?"S6(NGS)":""}
const LOGS_BRUTOS=["rangecmpb","rawephemb","glorawephemb","bd2rawephemb","gloephemerisb","galephemerisb"]; // mesmos do Survey Master
async function iniciarEstaticoColetora(){
  const e=S.est,n=nomeArq(e.nome),taxa=(num(e.taxa)||1);
  if(!receptorReal()){toast("Conecte o receptor");return}
  if(marcaRx()==="spectra"){toast("Gravar na coletora ainda não está disponível para Spectra. Use a memória do receptor.");return}
  const arq=n+"_"+new Date().toISOString().slice(0,10).replace(/-/g,"")+".cnb";
  const d0=new Date(),cab=`COMPASS COLLECTED DATA FILE\r\nver 55.0\r\nReceiverID:${R.serie||S.btNome||""}\r\nDate:${d0.getUTCFullYear()}/${String(d0.getUTCMonth()+1).padStart(2," ")}/${String(d0.getUTCDate()).padStart(2," ")}\r\nMarkerName:${n}\r\nAntHigh:${(num(e.altAnt)||0).toFixed(6)}\r\n`;
  try{await NP.GnssTcp.recordStart({path:"WASurvey/"+arq,header:cab})}catch(er){toast("Não consegui criar o arquivo: "+(er.message||er));return}
  R.gravCol={arq,bytes:0};
  await enviarLista([`log rangecmpb ontime ${taxa}`,...LOGS_BRUTOS.slice(1).map(m=>`log ${m} onchanged`)],"Brutos para a coletora",200);
  if(e.formato!=="RINEX")e.formato="CNB";e.arqRx=arq;e.gravando=true;e.inicio=Date.now();salvar();render();falar("Gravação estática iniciada");toast("Gravando na coletora: "+arq);
  R.gravTimer=setInterval(salvarBrutos,5000);
}
// os bytes vão direto do receptor para o arquivo no lado nativo (continua gravando com o app fechado)
async function salvarBrutos(){

  try{const st=await NP.GnssTcp.state();g.bytes=st.gravBytes||0}catch(e){}
}
async function pararEstaticoColetora(auto){
  clearInterval(R.gravTimer);
  if(receptorReal())await enviarLista(LOGS_BRUTOS.map(m=>"unlog "+m),"Parar brutos",120);
  const g=R.gravCol;R.gravCol=null;try{const r=await NP.GnssTcp.recordStop();if(g)g.bytes=r.bytes||g.bytes}catch(e){}
  const fmt=S.est.formato;pararEstatico(auto);const f=S.arquivos[0];if(f&&g){f.destino="coletora";f.caminho="WASurvey/"+g.arq;f.mb=g.bytes/1048576;f.formato="CNB";salvar();if(fmt==="RINEX")setTimeout(()=>gerarRinex(f),800)}

// ---------- RINEX ----------
const RNX_SIS={ibge:["GR","IBGE-PPP (GPS + GLONASS)"],semsbas:["GREC","PPK / drone (GPS, GLONASS, Galileo, BeiDou)"],tudo:["","Completo (todos, com SBAS)"]};
function selRnxSis(){const v=S.rnxSis||"ibge";return `<label class="f">Tipo de RINEX<select data-bind="rnxSis">${Object.entries(RNX_SIS).map(([k,[x,t]])=>`<option value="${k}" ${v===k?"selected":""}>${t}</option>`).join("")}</select></label>
  <span class="muted small">${v==="ibge"?"Só GPS e GLONASS: é o que o IBGE-PPP processa (sem SBAS, Galileo e BeiDou, que dão erro lá).":v==="semsbas"?"Sem SBAS: para PPK do drone e programas de pós-processamento.":"Todos os sinais gravados, inclusive SBAS (alguns programas não aceitam)."}</span>`}
function rnxSistemas(){return (RNX_SIS[S.rnxSis||"ibge"]||RNX_SIS.ibge)[0]}
async function gerarRinex(f){
  if(!NATIVO||!f?.caminho)return;R.convertendo=f.id;render();toast("Gerando RINEX… pode levar alguns segundos");
  try{const alt=num(f.altAnt);const r=await NP.GnssTcp.cnbToRinex({path:f.caminho,name:nomeRinex(f.nome,f.inicio),marker:nomeArq(f.nome),antHeight:isNaN(alt)?0:alt,interval:num(S.rnxInt)||num(f.taxa)||1,
      lat:f.lat||0,lon:f.lon||0,h:f.h||0,receiver:R.serie||S.btNome||"",antenna:antenaModelo(),zip:true,systems:rnxSistemas()});
    f.rinex={zip:r.zip,obs:r.obs,nav:r.nav,epocas:r.epochs,sats:r.sats,sis:(r.systems||"").replace(/[\[\]]/g,""),mb:(r.zipBytes||0)/1048576,tipo:S.rnxSis||"ibge"};salvar();bip("ok");falar("RINEX pronto");
    toast(`RINEX pronto: ${r.epochs} épocas, ${r.sats} satélites`)}
  catch(e){bip("erro");toast("Não consegui gerar o RINEX: "+(e.message||e))}
  R.convertendo=null;render();
}
// nome curto padrão RINEX: 4 letras + dia do ano + sessão (ex.: BASE3020)
function nomeRinex(nome,t){const d=new Date(t||Date.now()),doy=Math.floor((d-Date.UTC(d.getUTCFullYear(),0,1))/86400000)+1;
  return (String(nome||"BASE").replace(/[^A-Za-z0-9]/g,"").toUpperCase()+"XXXX").slice(0,4)+String(doy).padStart(3,"0")+"0"}
async function converterCnbEscolhido(){
  let a;try{a=await NP.GnssTcp.pickFile()}catch(e){if(!String(e.message||e).includes("cancel"))toast("Não abriu o arquivo: "+(e.message||e));return}
  const nome=a.name.replace(/\.[^.]+$/,"");const f={id:Date.now(),nome,inicio:Date.now(),fim:Date.now(),dur:0,taxa:S.rnxInt||"1",destino:"coletora",formato:"CNB (importado)",altAnt:S.rnxAlt||"",medida:"",mb:a.bytes/1048576,ppp:"nao",caminho:a.path,importado:true};
  S.arquivos.unshift(f);salvar();render();
  const alt=num(S.rnxAlt);R.convertendo=f.id;render();toast("Convertendo "+a.name+"…");
  try{const r=await NP.GnssTcp.cnbToRinex({path:a.path,name:nomeRinex(nome),marker:"",antHeight:isNaN(alt)?NaN:alt,interval:num(S.rnxInt)||1,lat:0,lon:0,h:0,receiver:"",antenna:"",zip:true,systems:rnxSistemas()});
    f.rinex={zip:r.zip,obs:r.obs,nav:r.nav,epocas:r.epochs,sats:r.sats,sis:(r.systems||"").replace(/[\[\]]/g,""),mb:(r.zipBytes||0)/1048576};f.lat=r.lat;f.lon=r.lon;f.h=r.h;
    f.dur=(new Date(r.end.replace(" ","T")+"Z")-new Date(r.start.replace(" ","T")+"Z"))/1000;f.inicio=new Date(r.start.replace(" ","T")+"Z").getTime();f.fim=f.inicio+f.dur*1000;
    salvar();bip("ok");falar("RINEX pronto");toast(`RINEX pronto: ${r.epochs} épocas · ${r.start} a ${r.end} UTC`)}
  catch(e){bip("erro");toast("Não consegui converter: "+(e.message||e))}
  R.convertendo=null;render();
}
async function salvarDownloads(caminhos){
  const onde=[];for(const c of caminhos){try{const r=await NP.GnssTcp.saveToDownloads({path:c,mime:c.endsWith(".zip")?"application/zip":"application/octet-stream"});onde.push(r.where)}catch(e){toast("Não salvei "+c.split("/").pop()+": "+(e.message||e));return}}

// tipo do arquivo para o Android (sem isso o WhatsApp mandava só o nome do .dxf)
function mimeDe(n){const x=(n.split(".").pop()||"").toLowerCase();return {csv:"text/csv",txt:"text/plain",pdf:"application/pdf",zip:"application/zip",kml:"application/vnd.google-earth.kml+xml",geojson:"application/geo+json",json:"application/json"}[x]||"application/octet-stream"}
async function compartilharArquivoCol(f){
  try{const nome=f.caminho.split("/").pop();
    // o compartilhar do Android só enxerga a pasta de cache: copia para lá antes
    if(NP.GnssTcp.shareFiles){await NP.GnssTcp.shareFiles({files:[{path:f.caminho,dir:"data"}],mime:mimeDe(nome),title:"Enviar "+nome});return}
    try{await NP.Filesystem.deleteFile({path:nome,directory:"CACHE"})}catch(e){}
    await NP.Filesystem.copy({from:f.caminho,directory:"DATA",to:nome,toDirectory:"CACHE"});
    const u=await NP.Filesystem.getUri({path:nome,directory:"CACHE"});
    await NP.Share.share({title:nome,text:"Arquivo estático "+nome,files:[u.uri],dialogTitle:"Enviar "+nome})}
  catch(e){if(!String(e.message||e).includes("cancel"))toast("Não consegui compartilhar: "+(e.message||e))}
}
async function iniciarEstaticoCN(){
  if(S.est.destino==="coletora"){return iniciarEstaticoColetora()}
  const e=S.est;e.formato="CNB";e.destino="receptor";e.arqRx="";
  const n=nomeArq(e.nome),taxa=(num(e.taxa)||1).toFixed(6),h=num(e.altAnt)||0;
  if(receptorReal()&&marcaRx()==="spectra"){
    const sit=n.replace(/[^A-Za-z0-9]/g,"").slice(-4).padStart(4,"0").toUpperCase();
    await enviarLista([`$PASHS,ANH,${h.toFixed(4)},V`,`$PASHS,DRI,${(num(e.taxa)||1).toFixed(2)}`,`$PASHS,SIT,${sit}`,"$PASHS,REC,Y","$PASHS,NME,RCS,C,ON,1"],"Gravar estático (Spectra)",250);
    e.formato="ATOM (Spectra)";e.arqRx="site "+sit;
  }else if(receptorReal()){
    R.estOk=false;R.arqsAntes=[...(R.arqsRx||[])];
    const mod=antenaModelo();
    await enviarLista([...(mod?[`set antenna ${h.toFixed(6)} 1 ${mod}`]:[]),`set datarecord ${n} ${n}.cnb ${taxa} 0 1 0 7000.000000 0`,`set datarecord start ${n}.cnb`,"log datarecord"],"Gravar estático",250);
    setTimeout(()=>{if(S.est.gravando)toast(R.estOk?"O receptor confirmou: gravando "+n+".cnb":"Comandos enviados. Se o LED de gravação do receptor não acender, confira em Comandos do receptor.")},2500);
  }
  if(!e.arqRx||marcaRx()!=="spectra")e.arqRx=nomeCnbRx();
  e.rxSerie=R.serie||S.btNome||"";e.gravando=true;e.inicio=Date.now();salvar();render();falar("Gravação estática iniciada");toast("Gravação estática iniciada no receptor ("+e.arqRx+"). Pode desconectar: o receptor continua gravando.");
}
// a gravação na memória do receptor segue mesmo desconectado; para parar é preciso estar ligado nele
function noReceptorGravando(){const e=S.est;return receptorReal()&&(!e.rxSerie||e.rxSerie===(R.serie||S.btNome||""))}
async function pararEstaticoCN(auto,forcar){

// o receptor ComNav ignora o nome pedido e grava como SÉRIE + dia do ano + hora UTC (ex.: T72L010173021944.cnb)

async function listarArquivosRx(){if(!receptorReal()){toast("Conecte o receptor");return}R.arqsRx=[];await enviarComando("log recordfile "+dataRx()+"-"+dataRx(),true);toast("Pedindo a lista de arquivos ao receptor…");setTimeout(render,2500)}

  if(!S.loc||!S.conectado){chegouAviso=false;return}
  const c=S.cfg;if(!c.locVibrar&&!c.locSom)return;
  const al=alvoEN();if(!al)return;const d=Math.hypot(al.E-G.E,al.N-G.N),tol=num(S.locTol)||0.03,raio=num(c.locRaio)||5,now=Date.now();

    if(!chegouAviso){chegouAviso=true;if(c.locVibrar)vib([500,100,500],true);if(fixo)falar("Ponto achado")}
    // achado com boa precisão: bipe duplo agudo repetido (som diferente do de aproximação)
    if(fixo&&now-ultPulso>=700){ultPulso=now;if(c.locSom){tom(2093,.09);setTimeout(()=>tom(2637,.12),120)}if(c.locVibrar)vib(60,true)}
    return}

  const per=Math.max(120,Math.min(1600,120+d/raio*1480));
  if(now-ultPulso>=per){ultPulso=now;if(c.locVibrar)vib(35,true);if(c.locSom)tom(700+(1-d/raio)*900,.05)}

function parseAng(s){s=String(s||"").trim();if(!s)return NaN;const p=s.replace(/[°'"’”]/g," ").replace(",",".").trim().split(/\s+/).map(Number);if(p.some(isNaN))return NaN;return p.length===1?p[0]:p[0]+(p[1]||0)/60+(p[2]||0)/3600}
function delaunay(P){ // Bowyer-Watson
  const n=P.length;if(n<3)return [];let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;for(const p of P){minx=Math.min(minx,p.E);miny=Math.min(miny,p.N);maxx=Math.max(maxx,p.E);maxy=Math.max(maxy,p.N)}
  const dm=Math.max(maxx-minx,maxy-miny)*20,mx=(minx+maxx)/2,my=(miny+maxy)/2;
  const V=P.map(p=>({x:p.E,y:p.N})).concat([{x:mx-dm,y:my-dm},{x:mx,y:my+dm},{x:mx+dm,y:my-dm}]);
  const cc=(a,b,c)=>{const A=V[a],B=V[b],C=V[c],d=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y));const ux=((A.x**2+A.y**2)*(B.y-C.y)+(B.x**2+B.y**2)*(C.y-A.y)+(C.x**2+C.y**2)*(A.y-B.y))/d,uy=((A.x**2+A.y**2)*(C.x-B.x)+(B.x**2+B.y**2)*(A.x-C.x)+(C.x**2+C.y**2)*(B.x-A.x))/d;return {x:ux,y:uy,r:(A.x-ux)**2+(A.y-uy)**2}};
  let T=[[n,n+1,n+2]].map(t=>({t,c:cc(...t)}));
  for(let i=0;i<n;i++){const p=V[i],bad=T.filter(o=>(p.x-o.c.x)**2+(p.y-o.c.y)**2<o.c.r);const ed=[];
    for(const o of bad)for(const [a,b] of [[o.t[0],o.t[1]],[o.t[1],o.t[2]],[o.t[2],o.t[0]]]){const k=ed.findIndex(e=>(e[0]===b&&e[1]===a)||(e[0]===a&&e[1]===b));if(k>=0)ed.splice(k,1);else ed.push([a,b])}
    T=T.filter(o=>!bad.includes(o));for(const [a,b] of ed)T.push({t:[a,b,i],c:cc(a,b,i)})}
  return T.map(o=>o.t).filter(t=>t.every(v=>v<n));
}
function calcVolume(ps,ref){
  const tris=delaunay(ps);let corte=0,aterro=0,area=0;const K=8;
  for(const [a,b,c] of tris){const A=ps[a],B=ps[b],C=ps[c];const ar=Math.abs((B.E-A.E)*(C.N-A.N)-(C.E-A.E)*(B.N-A.N))/2;area+=ar;
    let sp=0,sn=0,cnt=0;for(let i=0;i<=K;i++)for(let j=0;j<=K-i;j++){const k=K-i-j,dz=(A.h*i+B.h*j+C.h*k)/K-ref;if(dz>0)sp+=dz;else sn+=-dz;cnt++}
    corte+=ar*sp/cnt;aterro+=ar*sn/cnt}
  return {corte,aterro,area,n:tris.length,tris};
}

function tileLayer(fundo,X,Y,W,H,mpp){
  const z0=zonaAtual(),h0=hemiAtual();
  const [la1,lo1]=fromUTM(S.mapCE-W/2*mpp,S.mapCN+H/2*mpp,z0,h0),[la2,lo2]=fromUTM(S.mapCE+W/2*mpp,S.mapCN-H/2*mpp,z0,h0);
  const latC=(la1+la2)/2;let z=Math.round(Math.log2(156543.03*Math.cos(latC*Math.PI/180)/mpp));z=Math.max(3,Math.min(fundo==="sat"?18:19,z));
  const n=2**z,tx=lo=>Math.floor((lo+180)/360*n),ty=la=>{const r=la*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)};
  const lon=x=>x/n*360-180,lat=y=>Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;
  const x1=tx(Math.min(lo1,lo2)),x2=tx(Math.max(lo1,lo2)),y1=ty(Math.max(la1,la2)),y2=ty(Math.min(la1,la2));
  if((x2-x1+1)*(y2-y1+1)>64)return "";
  let out="";
  for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++){
    const [eA,nA]=toUTM(lat(y),lon(x),z0,h0),[eB,nB]=toUTM(lat(y+1),lon(x+1),z0,h0);
    const px=X(eA),py=Y(nA),w=X(eB)-px,h=Y(nB)-py;
    const url=fundo==="sat"?`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`:`https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
    out+=`<image href="${url}" x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${(w+0.6).toFixed(1)}" height="${(h+0.6).toFixed(1)}" preserveAspectRatio="none"/>`;
  }
  return out;
}

async function iniciarDrone(){
  if(!S.drLocal&&!S.drExt){toast("Escolha o caster no celular, o da internet ou os dois");return}
  if(S.baseModo!=="auto"&&!(S.baseE&&S.baseN&&S.baseH)){toast("Defina a coordenada da base primeiro");return}
  if(S.drLocal&&!(S.drMount||"").trim()){toast("Preencha o ponto de montagem do caster no celular");return}
  {const d=baseDist();if(d!=null&&d>30){toast(`A coordenada da base está a ${d>=1000?br(d/1000,1)+" km":Math.round(d)+" m"} de onde o receptor está. Refaça a média ou confira o marco.`);bip("erro");return}}
  if(S.drExt&&!((S.drHost||"").trim()&&(S.drHMount||"").trim())){toast("Preencha o endereço e o ponto de montagem do caster na internet");return}
  const etapas=["Configurar a base"];if(S.drLocal)etapas.push("Ligar o caster no celular");if(S.drExt)etapas.push("Conectar ao caster na internet");

    :`<b>Base pronta.</b> A correção está indo para ${esc(S.drHost)}:${esc(S.drHPorta)}/${esc(S.drHMount)}. Conecte o drone nesse caster.`;

// ---------- pressionar o mapa por 3 s: digitar ponto para locar (já vem com a coordenada do lugar pressionado) ----------
const PRESSAO_MS=3000;
function pressaoIniciar(x,y){pressaoCancelar();
  const d=document.createElement("div");d.id="pressAnel";d.style.cssText=`position:fixed;left:${x-34}px;top:${y-34}px;width:68px;height:68px;border-radius:50%;border:4px solid var(--accent);pointer-events:none;z-index:50;opacity:.9;transform:scale(.2);transition:transform ${PRESSAO_MS}ms linear`;
  document.body.appendChild(d);requestAnimationFrame(()=>d.style.transform="scale(1)");
  MG.pressT=setTimeout(()=>{pressaoCancelar();if(MG.moved||MG.p.size!==1)return;
    const sv=$("mapSvg");if(!sv)return;const r=sv.getBoundingClientRect(),vb=sv.viewBox.baseVal,k=vb.width/r.width,mpp=S.zoom/100;
    const E=S.mapCE+((x-r.left)*k-vb.width/2)*mpp,N=S.mapCN-((y-r.top)*k-vb.height/2)*mpp;
    MG.supr=true;setTimeout(()=>MG.supr=false,600);vib(80,true);abrirDigitarPonto(E,N)},PRESSAO_MS)}
function pressaoCancelar(){clearTimeout(MG.pressT);const d=document.getElementById("pressAnel");if(d)d.remove()}
function reguaPainel(){const rg=R.regua||[];let tot=0;for(let i=1;i<rg.length;i++)tot+=Math.hypot(rg[i].E-rg[i-1].E,rg[i].N-rg[i-1].N);
  const u=rg.length>=2?rg[rg.length-1]:null,a=rg.length>=2?rg[rg.length-2]:null;
  const ult=u?`${br(Math.hypot(u.E-a.E,u.N-a.N),3)} m · az ${fmtAng(((Math.atan2(u.E-a.E,u.N-a.N)*180/Math.PI)+360)%360)}`:"";
  return `<div style="position:absolute;left:60px;right:40px;top:50px;padding:10px 12px;border-radius:10px;background:rgba(15,23,32,.92);border:1px solid #5BE3E3;z-index:3;display:grid;gap:6px">
    ${rg.length<2?`<span class="small"><b style="color:#5BE3E3">Régua:</b> toque em um ponto ou em qualquer lugar do mapa${rg.length?" (falta o segundo)":""}.</span>`
      :`<span class="m" style="font-weight:800;color:#5BE3E3;font-size:17px">${br(tot,3)} m${rg.length>2?` <span class="small" style="color:var(--muted)">total, ${rg.length-1} trechos</span>`:""}</span><span class="small m">Último trecho: ${ult}</span>`}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"><button style="min-height:36px" data-act="reguaDesf" ${rg.length?"":"disabled"}>Desfazer</button><button style="min-height:36px" data-act="reguaLimpar" ${rg.length?"":"disabled"}>Limpar</button><button style="min-height:36px" data-act="mapMedir">Fechar</button></div></div>`}
function abrirDigitarPonto(E,N){const dc_=+S.cfg.dec||3;R.dig={nome:S.lcNome||"L-01",E:E!=null?E.toFixed(dc_):"",N:N!=null?N.toFixed(dc_):"",h:"",desc:"",salvar:S.lcSalvar!==false};render()}

// ---------- gestos do mapa ----------
const MG={p:new Map(),start:null,moved:false,supr:false};
function mgPts(){return [...MG.p.values()]}
document.addEventListener("pointerdown",e=>{
  const sv=e.target.closest&&e.target.closest("#mapSvg");if(!sv)return;
  MG.p.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const ps=mgPts();
  if(ps.length===1){MG.start={x:e.clientX,y:e.clientY};MG.moved=false;MG.sc=1;MG.c0={x:e.clientX,y:e.clientY};MG.c1=MG.c0;pressaoIniciar(e.clientX,e.clientY)}
  else pressaoCancelar();
  if(ps.length===2){MG.d0=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)/(MG.sc||1);MG.c0={x:(ps[0].x+ps[1].x)/2-(MG.c1.x-MG.c0.x),y:(ps[0].y+ps[1].y)/2-(MG.c1.y-MG.c0.y)}}
  R.gesto=true;
});
document.addEventListener("pointermove",e=>{
  if(!MG.p.has(e.pointerId))return;MG.p.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const ps=mgPts(),g=$("mapG");if(!g)return;
  if(ps.length===1){MG.c1={x:ps[0].x,y:ps[0].y};if(Math.abs(MG.c1.x-MG.start.x)+Math.abs(MG.c1.y-MG.start.y)>6)MG.moved=true}
  else if(ps.length>=2){MG.c1={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};MG.sc=Math.max(.05,Math.min(20,Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)/MG.d0));MG.moved=true}
  if(!MG.moved)return;pressaoCancelar();
  const sv=$("mapSvg"),r=sv.getBoundingClientRect(),k=sv.viewBox.baseVal.width/r.width;
  const c0x=(MG.c0.x-r.left)*k,c0y=(MG.c0.y-r.top)*k,c1x=(MG.c1.x-r.left)*k,c1y=(MG.c1.y-r.top)*k;
  g.setAttribute("transform",`translate(${c1x} ${c1y}) scale(${MG.sc}) translate(${-c0x} ${-c0y})`);
});
function mgFim(e){
  pressaoCancelar();
  if(!MG.p.has(e.pointerId))return;MG.p.delete(e.pointerId);
  if(MG.p.size>0){const ps=mgPts();MG.start={x:ps[0].x,y:ps[0].y};return}
  R.gesto=false;
  if(!MG.moved)return;
  const sv=$("mapSvg");if(!sv)return;const r=sv.getBoundingClientRect(),vb=sv.viewBox.baseVal,k=vb.width/r.width,W=vb.width,H=vb.height;
  const mpp=S.zoom/100,sc=MG.sc||1,mpp2=Math.max(.01,Math.min(20,mpp/sc));
  const c0x=(MG.c0.x-r.left)*k,c0y=(MG.c0.y-r.top)*k,c1x=(MG.c1.x-r.left)*k,c1y=(MG.c1.y-r.top)*k;
  // o ponto do mapa sob c0 passa a ficar sob c1
  const E0=S.mapCE+(c0x-W/2)*mpp,N0=S.mapCN-(c0y-H/2)*mpp;
  S.zoom=mpp2*100;S.mapCE=E0-(c1x-W/2)*mpp2;S.mapCN=N0+(c1y-H/2)*mpp2;S.seguir=false;MG.supr=true;setTimeout(()=>MG.supr=false,80);render();
}
document.addEventListener("pointerup",mgFim);document.addEventListener("pointercancel",mgFim);
document.addEventListener("click",e=>{if(MG.supr&&e.target.closest&&e.target.closest("#mapSvg")){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener("wheel",e=>{const sv=e.target.closest&&e.target.closest("#mapSvg");if(!sv)return;e.preventDefault();
  const r=sv.getBoundingClientRect(),vb=sv.viewBox.baseVal,k=vb.width/r.width,cx=(e.clientX-r.left)*k,cy=(e.clientY-r.top)*k,mpp=S.zoom/100,f=e.deltaY>0?1.25:0.8,mpp2=Math.max(.01,Math.min(20,mpp*f));
  const E0=S.mapCE+(cx-vb.width/2)*mpp,N0=S.mapCN-(cy-vb.height/2)*mpp;S.zoom=mpp2*100;S.mapCE=E0-(cx-vb.width/2)*mpp2;S.mapCN=N0+(cy-vb.height/2)*mpp2;S.seguir=false;render()},{passive:false});

function fromUTM(E,N,zona,hemi){
  const P=tmPar(zona,hemi),a=6378137,f=1/298.257222101,k0=P.k0,e2=f*(2-f),ep2=e2/(1-e2),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2)),d=Math.PI/180;
  const x=E-P.FE,y=N-P.FN,M=y/k0,mu=M/(a*(1-e2/4-3*e2**2/64-5*e2**3/256));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1**2/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const N1=a/Math.sqrt(1-e2*Math.sin(p1)**2),T1=Math.tan(p1)**2,C1=ep2*Math.cos(p1)**2,R1=a*(1-e2)/(1-e2*Math.sin(p1)**2)**1.5,D=x/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=P.lam0*d+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return [lat/d,lon/d];
}
function getPt(v){
  if(v==="atual")return {E:G.E,N:G.N,h:cotaTerreno(),nome:"Posição atual"};
  const p=proj()?.pontos[+v];if(!p)return null;const [E,N]=ptEN(p);return {E,N,h:p.h,nome:p.nome};
}
function irAzimute(){let a;if((S.irModo||"linha")==="linha"){const A=getPt(S.irL1??"0"),B=getPt(S.irL2??"1");if(!A||!B||(A.E===B.E&&A.N===B.N))return NaN;a=Math.atan2(B.E-A.E,B.N-A.N)*180/Math.PI}else a=parseAng(S.irAz);
  if(isNaN(a))return NaN;a+=num(S.irGiro)||0;return ((a%360)+360)%360}
function ptOpts(sel,comAtual){const pts=proj()?.pontos||[];return (comAtual?`<option value="atual" ${sel==="atual"?"selected":""}>Posição atual</option>`:"")+pts.map((p,i)=>`<option value="${i}" ${String(sel)===String(i)?"selected":""}>${esc(p.nome)} · ${esc(p.cod)}</option>`).join("")}
function novoPonto(nome,cod,E,N,h){const [lat,lon]=fromUTM(E,N,zonaAtual(),hemiAtual());proj().pontos.push({nome,cod,lat,lon,E,N,h,h_rms:0,st:"CALC",alt:0,quando:new Date().toISOString()})}
function estaca(m){const I=num(S.cfg.estacaInt)||20,e=Math.floor(m/I+1e-9),r=m-e*I;return `Est. ${e} + ${br(r)}`}
function polyLen(ps){let L=0;for(let i=1;i<ps.length;i++)L+=Math.hypot(ps[i].E-ps[i-1].E,ps[i].N-ps[i-1].N);return L}
function polyArea(ps){let A=0;for(let i=0;i<ps.length;i++){const a=ps[i],b=ps[(i+1)%ps.length];A+=a.E*b.N-b.E*a.N}return Math.abs(A)/2}
function projNaLinha(ps,E,N){ // estaca e afastamento de (E,N) em relação à polilinha
  let best=null,acc=0;
  for(let i=1;i<ps.length;i++){const a=ps[i-1],b=ps[i],dx=b.E-a.E,dy=b.N-a.N,L=Math.hypot(dx,dy);if(!L)continue;
    let t=((E-a.E)*dx+(N-a.N)*dy)/(L*L);const tc=Math.max(0,Math.min(1,t));
    const px=a.E+tc*dx,py=a.N+tc*dy,off=((E-a.E)*dy-(N-a.N)*dx)/L; // + = direita
    const dist=Math.hypot(E-px,N-py);
    if(!best||dist<best.dist)best={dist,est:acc+tc*L,off,h:a.h+(b.h-a.h)*tc,fora:t<0||t>1};acc+=L}
  return best;
}
function pontoNaLinha(ps,est,off){
  let acc=0;for(let i=1;i<ps.length;i++){const a=ps[i-1],b=ps[i],dx=b.E-a.E,dy=b.N-a.N,L=Math.hypot(dx,dy);
    if(est<=acc+L||i===ps.length-1){const t=(est-acc)/L,ux=dx/L,uy=dy/L;return {E:a.E+t*dx+uy*off,N:a.N+t*dy-ux*off,h:a.h+(b.h-a.h)*t}}acc+=L}
}
function linhasProj(){return proj()?.linhas||[]}

      proj().pontos.push({nome,cod,lat:m("lat"),lon:m("lon"),E:E0,N:N0,h:m("h")-alt-ondCota(m("lat"),m("lon"),R.sep)+rnOff(),cotaTipo:tipoCota(),...(rnAtiva()?{rn:proj().rn.nome,rnOff:rnOff()}:{}),h_rms:hr,v_rms:Math.max(...amostras.map(x=>x.vr)),pdop:+m("pd").toFixed(2),hdop:+m("hd").toFixed(2),vdop:+m("vd").toFixed(2),sats:Math.round(m("sv")),idade:+m("id").toFixed(1),epocas:amostras.length,
        disp:+disp.toFixed(4),obs:obsSeg?amostras.length:undefined,sep:R.sep||0,hElip:m("h")-alt,altTipo:S.altTipo||"vertical",receptor:nomeRx(),st,alt,quando:new Date().toISOString()});

  c+="0 g\n";
  // barra de escala e norte

    proj().rn?.ativo?`Cotas referidas à ${proj().rn.nome} (cota ${proj().rn.cota})`:""].filter(Boolean);
  for(const l of linhas){c+=T(M,yy,9,l);yy-=12}

function lerTexto(txt,ordemSel){

    const nome=new TextDecoder().decode(u8.subarray(o+46,o+46+nl));o+=46+nl+el+cl;
    const ini=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),dados=u8.subarray(ini,ini+cs);
    if(met===0)out[nome]=dados.slice().buffer;
    else if(met===8){if(typeof DecompressionStream==="undefined")throw new Error("este celular não abre .zip compactado; envie os arquivos .shp e .dbf soltos");const ds=new DecompressionStream("deflate-raw");out[nome]=await new Response(new Blob([dados]).stream().pipeThrough(ds)).arrayBuffer()}}

}

async function lerArquivosImport(files){

  // abre .zip/.kmz
  for(const nm of Object.keys(mapa))if(/\.(zip|kmz)$/i.test(nm)){try{const z=await unzip(mapa[nm]);delete mapa[nm];for(const k in z)if(!k.endsWith("/"))mapa[k.split("/").pop()]=z[k]}catch(er){toast("Não consegui abrir "+nm+": "+(er.message||er));return}}
  let pts=[],avisos=[],origem=[];
  const ext=n=>(n.split(".").pop()||"").toLowerCase(),base=n=>n.replace(/\.[^.]+$/,"").toLowerCase();
  try{
    for(const nm of Object.keys(mapa)){const x=ext(nm);let r=null;
      if(x==="shp"){const dbf=Object.keys(mapa).find(k=>ext(k)==="dbf"&&base(k)===base(nm));r=lerSHP(mapa[nm],dbf?mapa[dbf]:null,c.vertices)}
      else if(x==="dxf")r=lerDXF(decTexto(mapa[nm]),c.vertices);
      else if(x==="kml")r=lerKML(decTexto(mapa[nm]),c.vertices);
      else if(x==="geojson"||x==="json")r=lerGeoJSON(decTexto(mapa[nm]),c.vertices);
      else if(["csv","txt","xyz","pnt","dat","prn",""].includes(x))r=lerTexto(decTexto(mapa[nm]),c.ordem);
      else continue;
      pts=pts.concat(r.pts);origem.push(nm);if(r.aviso)avisos.push(r.aviso)}
  }catch(er){toast("Erro ao ler o arquivo: "+(er.message||er));return}
  if(!origem.length){toast("Formato não reconhecido. Use CSV, TXT, DXF, SHP (com .dbf), KML/KMZ ou GeoJSON.");return}
  R.impPrev={pts,origem:origem.join(", "),aviso:[...new Set(avisos)].join(" · ")};render();
  if(!pts.length)toast("Não achei pontos no arquivo");
}

  if(R.dig){R.dig=null;render();return}

function capturaResposta(l){
  if(!l||l.length<2||l.length>400)return;
  if(/^\$(GP|GN|GL|GA|GB|BD|GQ)(GGA|GSA|GSV|RMC|VTG|GST|ZDA|GLL|GNS)\b/.test(l))return;
  let imp=0;for(let j=0;j<l.length;j++){const c=l.charCodeAt(j);if(c<32||c>126)imp++}
  if(imp>l.length*0.1)return; // binário (RTCM etc.)
  R.cons.push("← "+l);if(R.cons.length>300)R.cons.splice(0,100);
  if(/OK|accepted|Command|VERSION|\$\$SI/i.test(l))R.respondeu=true;
  const b=l.match(/bat\w*\W{0,3}(\d{1,3}(?:\.\d+)?)\s*%/i);if(b&&+b[1]<=100)R.bateria=Math.round(+b[1]);
  if(/version|firmware/i.test(l)&&!R.versao)R.versao=l.slice(0,120);
}

function lerBinario(txt){
  R.bbuf=(R.bbuf||"")+txt;if(R.bbuf.length>65536)R.bbuf=R.bbuf.slice(-8192);

    if(R.bbuf.length<i+10){R.bbuf=R.bbuf.slice(i);return}
    const b=k=>R.bbuf.charCodeAt(i+k)&255;
    const hl=b(3),id=b(4)|(b(5)<<8),ml=b(8)|(b(9)<<8);
    if(hl<20||hl>40||ml>4000){R.bbuf=R.bbuf.slice(i+3);continue}
    if(R.bbuf.length<i+hl+ml+4){R.bbuf=R.bbuf.slice(i);return}
    const pl=R.bbuf.slice(i+hl,i+hl+ml);R.bbuf=R.bbuf.slice(i+hl+ml+4);R.respondeu=true;
    const u=k=>pl.charCodeAt(k)&255;
    if(id===1320&&ml>=4){ // evento de estado: [n] + n x (chave, valor u16)
      const n=u(0);for(let k=0;k<n&&1+k*3+2<ml;k++){const key=u(1+k*3),v=u(2+k*3)|(u(3+k*3)<<8);
        if(key===0x2f&&v<=100){const ant=R.bateria;R.bateria=v;if(ant!==v&&S.tela==="home")render(false)}}
    }
    if(id===37&&ml>=40){const str=(a,n)=>pl.slice(a,a+n).replace(/[\x00 ]+$/,"").trim();R.serie=str(24,16);R.versao=str(40,16)||R.versao;R.placa=str(8,16);if(!S.antFaseManual&&R.serie){const f=/^S6/i.test(R.serie)?"0.078":/^T7/i.test(R.serie)?"0.057":null;if(f&&S.antFase!==f){S.antFase=f;salvar()}}}

function marcaRx(){const m=(rec()?.marca||"").toLowerCase(),n=(S.conexao==="bt"?(S.btNome||""):"").toUpperCase(),sr=(R.serie||"").toUpperCase();
  if(/^SP\d|PROMARK/.test(n))return "spectra";
  if(/^(R\d{1,3}\b|R\d{1,3}[ ,_-]|SPS\d|TRIMBLE|DA2|CATALYST)/.test(n)||/R980|R12I|R10/.test(n)||/^\d{10}$/.test(n))return "trimble";
  if(m==="trimble")return "trimble";
  if(/^(S6|T7|T3|N3|M6)/.test(n)||/^(S6|T7)/.test(sr))return "comnav";
  if(m==="spectra")return "spectra";if(m==="comnav")return "comnav";return ""}

const TALKER={GP:"GPS",GL:"GLONASS",GA:"Galileo",GB:"BeiDou",BD:"BeiDou",GQ:"QZSS"};
function nmea(l){
  const star=l.indexOf("*"),body=l.slice(1,star>0?star:undefined);
  if(star>0){let c=0;for(const ch of body)c^=ch.charCodeAt(0);if(c!==parseInt(l.slice(star+1,star+3),16))return}
  const f=body.split(","),tal=f[0].slice(0,2),t=f[0].slice(2);
  if(f[0]==="PASHR"){R.respondeu=true;
    if(f[1]==="PWR"&&f[5]!==""&&+f[5]<=100){R.bateria=+f[5]}
    if(f[1]==="RID"){R.serie=(f[8]||"").trim();R.versao="Spectra "+(f[2]||"")+" fw "+(f[3]||"")}
    return}
  R.ultimo=Date.now();G.nmea.push(l);if(G.nmea.length>60)G.nmea.splice(0,G.nmea.length-40);
  if(t==="GGA"){
    const q=+f[6];G.fix=q===4?4:q===5?5:q>0?1:0;G.dgps=q===2||q===9;G.sats=+f[7]||0;const hdop=+f[8];
    if(q>0&&f[2]){G.lat=dm2deg(f[2],f[3]);G.lon=dm2deg(f[4],f[5]);G.h=(+f[9]||0)+(+f[11]||0);R.sep=+f[11]||0;atualizaEN()}
    G.idade=f[13]?+f[13]:0;R.ultGGA=l;if(!isNaN(hdop)&&hdop>0)G.hdop=hdop;
    if(!R.temGST&&!isNaN(hdop)){G.hrms=G.fix===4?0.01*Math.max(1,hdop):G.fix===5?0.25*hdop:1.5*hdop;G.vrms=G.hrms*1.7}
    if(!R.temGSA&&!isNaN(hdop))G.pdop=+(hdop*1.4).toFixed(1);
  }
  if(t==="GST"){const sl=+f[6],so=+f[7],sa=+f[8];if(!isNaN(sl)&&!isNaN(so)&&f[6]!==""){G.hrms=Math.sqrt(sl*sl+so*so);G.vrms=isNaN(sa)?G.hrms*1.7:sa;R.temGST=true}}
  if(t==="RMC"&&S.fonte==="tcp"&&f[2]==="A"&&/^\d{6}$/.test(f[9]||"")&&/^\d{6}/.test(f[1]||"")){
    const d=f[9],h=f[1],ms=Date.UTC(2000+ +d.slice(4,6),+d.slice(2,4)-1,+d.slice(0,2),+h.slice(0,2),+h.slice(2,4),+h.slice(4,6));if(ms>Date.UTC(2025,0,1)&&ms<Date.UTC(2045,0,1))licTempoConfiavel(ms)}
  if(t==="RMC"){const sp=(+f[7]||0)*0.514444,cr=+f[8];G.vel=sp;if(!isNaN(cr)&&f[8]!==""&&sp>0.2)G.course=cr}
  if(t==="VTG"){const cr=+f[1],kmh=+f[7];if(!isNaN(kmh))G.vel=kmh/3.6;if(!isNaN(cr)&&f[1]!==""&&G.vel>0.2)G.course=cr}
  if(t==="GSA"){const p=+f[15],hd=+f[16],vd=parseFloat(f[17]);if(!isNaN(p)&&p>0){G.pdop=p;R.temGSA=true}if(hd>0)G.hdop=hd;if(vd>0){G.vdop=vd;R.temVDOP=true}}
  if(t==="GSV"&&TALKER[tal]){G.const[TALKER[tal]]=+f[3]||0}
}

async function conectarReal(silencioso){
  if(!licPode())return;
  if(S.conexao==="celular")return ligarGpsCelular();
  R.manual=false;R.respondeu=false;
  if(S.conexao==="ble"){toast("O S6 e a maioria dos receptores usam Bluetooth clássico. Escolha essa opção.");return}
  if(S.conexao==="bt"&&!S.btAddr){toast("Toque em Buscar aparelhos pareados e escolha o receptor");return}
  S.conectando=true;render();
  try{
    R.buf="";R.bbuf="";R.ultGGA="";R.serie="";R.bateria=null;R.versao="";R.temGST=false;R.temGSA=false;G.nmea=[];G.const={GPS:0,GLONASS:0,Galileo:0,BeiDou:0};
    if(S.conexao==="bt"){S.btCanais=S.btCanais||{};const ch=R.canalTeste??(S.btCanais[S.btAddr]||0);R.canalAtual=ch;await NP.GnssTcp.btConnect({address:S.btAddr,channel:ch})}
    else await NP.GnssTcp.connect({host:S.ip.trim(),port:parseInt(S.porta)||9902,wifi:S.conexao==="wifi"});
    S.conectando=false;S.conectado=true;S.fonte="tcp";S.desde=Date.now();R.ultimo=Date.now();R.reconRx=0;render();
    iniciarSpectra();
    iniciarComNav().then(ok=>{if(ok===false&&!R.emLoop&&S.conexao==="bt"&&marcaRx()==="comnav")buscarCanal()});
    if(marcaRx()==="trimble"){trimbleIniciar();setTimeout(()=>{if(S.conectado&&S.fonte==="tcp"&&!R.ultGGA)toast("Trimble conectado, mas ainda sem posição. Confira se o app da Trimble está fechado (só um app por vez no Bluetooth).")},9000)}
    if(silencioso){toast("Receptor reconectado");falar("Dispositivo reconectado");return true}
    bip("ok");toast("Receptor conectado. Aguardando dados NMEA…");falar("Dispositivo conectado");setTimeout(prepararSegundoPlano,2500);
    setTimeout(()=>{if(S.conectado&&S.fonte==="tcp"&&!R.ultGGA)ligarNmea()},5000);
  }catch(e){S.conectando=false;if(silencioso){render();return false}
    if(S.conexao==="wifi"&&!R.autoDetect&&/EHOSTUNREACH|ECONNREFUSED|timed out|failed to connect/i.test(String(e.message||e))){R.autoDetect=true;toast("Não achei o receptor em "+S.ip+":"+S.porta+". Procurando na rede Wi-Fi…");
      const ok=await detectarWifi(false);R.autoDetect=false;if(ok){return conectarReal()}}
    render();bip("erro");toast("Não conectou: "+(e.message||e)+(S.conexao==="bt"?". Confira se o receptor está ligado, pareado e sem outro aparelho conectado nele.":". Confira o Wi-Fi do receptor, o IP e a porta."))}
}
// tenta religar o receptor sozinho (a correção NTRIP continua ligada e volta a ser repassada)

  R.reconRx=(R.reconRx||0)+1;S.reconectando=true;render();

  if(ok){S.reconectando=false;R.reconTot=(R.reconTot||0)+1;render();return}
  if(R.reconRx>=40){S.reconectando=false;S.corrLigada=false;if(NATIVO)NP.GnssTcp.ntripDisconnect().catch(()=>{});bip("erro");toast("Não consegui reconectar o receptor. Confira se ele está ligado.");render();return}

const PORTAS_WIFI=[9902,9904,9901,9903,5017,5018,6060,7000,7001,8000,8002,8080,9000,9001,9100,2101,10001,10002,5000,4001,23];
async function detectarWifi(manual){
  R.detectando=true;R.detectMsg="";render();
  try{
    const w=await NP.GnssTcp.wifiInfo();
    const host=w.dhcp||w.gateway;
    if(!host){R.detectMsg="O coletor não está ligado no Wi-Fi do receptor. Conecte na rede do receptor (ex.: T70-…, S6-…) nas configurações do Android.";return false}
    R.detectMsg=`Rede ${w.ssid||""}: este coletor ${w.ip||"?"}, receptor ${host}. Procurando a porta…`;render();
    const r=await NP.GnssTcp.scanPorts({host,ports:PORTAS_WIFI});
    S.ip=host;
    let abertas=(r.open||[]);
    if(!abertas.length){R.detectMsg=`Receptor em ${host}. Nenhuma porta comum respondeu; varrendo todas as portas (até 1 minuto)…`;render();const t=await NP.GnssTcp.scanRange({host,from:1,to:65535});abertas=t.open||[]}
    if(!abertas.length){R.detectMsg=`O receptor (${host}) não tem nenhuma porta aberta para o coletor. Use o Bluetooth.`;salvar();return false}
    // testa cada porta: a certa é a que manda NMEA ($G...) ou dados ComNav sozinha
    const boas=[],quietas=[];
    for(const pt of abertas.filter(p=>p!==80&&p!==443&&p!==53).slice(0,12)){
      R.detectMsg=`Receptor em ${host}. Testando a porta ${pt}…`;render();
      const pr=await NP.GnssTcp.probePort({host,port:pt});
      if(pr.bytes>0&&/\$G[PNLABQ]|\$BD|\xaaD\x12/.test(pr.text||""))boas.push(pt);else if(pr.bytes>=0&&!pr.closed)quietas.push(pt);
    }
    R.portasWifi=[...boas,...quietas];
    if(R.portasWifi.length){S.porta=String(R.portasWifi[0]);R.detectMsg=`Receptor em ${host}. ${boas.length?`A porta ${boas[0]} manda NMEA.`:`Nenhuma porta mandou NMEA sozinha; usando ${S.porta}.`} Portas abertas: ${abertas.join(", ")}.`;salvar();return true}
    R.detectMsg=`Receptor em ${host} (portas ${abertas.join(", ")}), mas todas fecham a conexão. Use o Bluetooth.`;salvar();return false;
  }catch(e){R.detectMsg="Não consegui detectar: "+(e.message||e);return false}
  finally{R.detectando=false;render()}
}

// formato da correção por receptor: S6 usa o envelope $$VD, T70 usa RTCM direto (visto na gravação do Survey Master)
function chaveRx(){return R.serie||S.btNome||S.ip||"x"}
function envAtual(){if(marcaRx()==="trimble")return "tr";S.envRx=S.envRx||{};if(!S.envFix2){S.envRx={};S.envFix2=true;salvar()}const k=chaveRx();if(S.envRx[k])return S.envRx[k];const mk=marcaRx();if(mk==="spectra")return "raw";if(mk==="comnav")return "vd";return "raw"}
async function ntripLigar(){
  if(S.fonte!=="tcp")toast("Sem receptor: vou só testar o acesso ao caster. A correção não é aplicada.");
  if(!S.caster||!S.mount){toast("Preencha o caster e o ponto de montagem");return false}
  try{await NP.GnssTcp.setEnvelope({mode:envAtual()})}catch(e){}
  R.envTentado=false;R.envTrocas=0;R.envUsado=envAtual();R.roverForcado=false;
  await NP.GnssTcp.ntripConnect({host:S.caster.trim(),port:parseInt(S.cport)||2101,mount:S.mount.trim(),user:S.user||"",pass:S.senha||"",gga:!!S.enviaGGA});
  R.ggaEnv=0;return true;
}
async function posicaoReferencia(){
  if(S.conectado&&G.fix>0)return {lat:G.lat,lon:G.lon,origem:S.fonte==="celular"?"GPS do celular":"receptor"};
  try{const p=await NP.Geolocation.getCurrentPosition({enableHighAccuracy:false,timeout:8000,maximumAge:600000});
    S.ultPos={lat:p.coords.latitude,lon:p.coords.longitude};salvar();return {...S.ultPos,origem:"GPS do celular"}}catch(e){}
  if(S.ultPos)return {...S.ultPos,origem:"última posição conhecida"};
  return null;
}
async function buscarMounts(){
  if(!NATIVO){toast("A busca de pontos de montagem funciona no app instalado");return}
  toast("Buscando pontos de montagem…");
  try{
    const [r,ref]=await Promise.all([NP.GnssTcp.ntripSourcetable({host:S.caster.trim(),port:parseInt(S.cport)||2101,user:S.user||"",pass:S.senha||""}),posicaoReferencia()]);
    let ign=0;
    const ms=r.text.split(/\r?\n/).filter(l=>l.startsWith("STR;")).map(l=>{const c=l.split(";");const lat=+c[9],lon=+c[10];
      const d=(ref&&!isNaN(lat)&&!(lat===0&&lon===0))?Math.hypot((lat-ref.lat)*111.32,(lon-ref.lon)*111.32*Math.cos(ref.lat*Math.PI/180)):NaN;
      return {m:c[1],cid:c[2],fmt:c[3],det:c[4]||"",rede:c[12]==="1",d,lat,lon}})
      .filter(x=>{const lixo=/SSR|EPH|Assisted/i.test(x.fmt+" "+x.cid+" "+x.det)||(x.lat===0&&x.lon===0)||isNaN(x.lat);if(lixo)ign++;return !lixo});
    ms.sort((a,b)=>(isNaN(a.d)?1e9:a.d)-(isNaN(b.d)?1e9:b.d));
    R.mounts=ms.slice(0,60);R.mountsRef=ref;R.mountsIgn=ign;render();
    toast(ms.length?`${ms.length} estações encontradas${ref?" · ordenadas pela distância":""}`:"Nenhuma estação na lista");
  }catch(e){toast("Não consegui ler a lista: "+(e.message||e))}

function lerProfundidade(txt){
  R.srvBuf=((R.srvBuf||"")+txt).slice(-2000);let m;
  const re=/\$[A-Z]{2}(DBT|DPT),([^*\r\n]*)/g;
  while((m=re.exec(R.srvBuf))){const f=m[2].split(",");
    if(m[1]==="DBT"){const met=parseFloat(f[2]);if(!isNaN(met))R.ultProf=met}       // metros no campo 3
    else{const d=parseFloat(f[0]),off=parseFloat(f[1])||0;if(!isNaN(d))R.ultProf=d+off}} // DPT: profundidade + offset
  if(/\$[A-Z]{2}(DBT|DPT)/.test(txt))R.ultProfT=Date.now();
}
function gravarLinhaNmea(){

  R.nmeaLog=R.nmeaLog||[];

function estatNmea(rows){
  const e={n:rows.length,st:{}},hr=[],vr=[],ct=[],pf=[];let dist=0,pe=null;
  let Emin=1/0,Emax=-1/0,Nmin=1/0,Nmax=-1/0;
  for(const x of rows){e.st[x.st]=(e.st[x.st]||0)+1;if(x.hrms>0)hr.push(x.hrms);if(x.vrms>0)vr.push(x.vrms);if(x.cota!=null&&!isNaN(x.cota))ct.push(x.cota);if(x.prof!=null)pf.push(x.prof);
    Emin=Math.min(Emin,x.E);Emax=Math.max(Emax,x.E);Nmin=Math.min(Nmin,x.N);Nmax=Math.max(Nmax,x.N);
    if(pe)dist+=Math.hypot(x.E-pe[0],x.N-pe[1]);pe=[x.E,x.N]}
  const ag=a=>a.length?{min:Math.min(...a),max:Math.max(...a),med:a.reduce((s,v)=>s+v,0)/a.length}:null;
  return Object.assign(e,{hr:ag(hr),vr:ag(vr),ct:ag(ct),pf:ag(pf),dist,Emin,Emax,Nmin,Nmax,cf:pf.length?ag(ct.map((c,i)=>c-pf[i]).filter(v=>!isNaN(v))):null});
}
function pdfNmea(s,rows){
  const W=595,H=842,M=40,br3=(x,n=3)=>x==null?"-":(+x).toFixed(n),esc=t=>String(t).replace(/([()\\])/g,"\\$1");
  const T=(x,y,sz,txt,b)=>`BT /${b?"F2":"F1"} ${sz} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td (${esc(txt)}) Tj ET\n`;
  const E=estatNmea(rows);let c="",y=H-M;
  c+=T(M,y,16,"Relatorio de levantamento (saida NMEA)",true);y-=18;
  c+=T(M,y,10,(s.nome||"")+"  -  "+(s.sis||""));y-=24;
  const row=(k,val)=>{c+=T(M,y,10,k,true)+T(M+175,y,10,val);y-=15};
  row("Receptor",s.receptor||"-");
  row("Inicio",new Date(s.inicio).toLocaleString("pt-BR"));
  row("Fim",new Date(s.fim).toLocaleString("pt-BR"));
  row("Duracao",dur((s.fim-s.inicio)/1000));
  row("Epocas gravadas (1/s)",String(E.n));
  const sol=Object.entries(E.st).map(([k,v])=>k+" "+v+" ("+Math.round(v/E.n*100)+"%)").join("   ");
  row("Solucao",sol);
  y-=6;c+=T(M,y,12,"Precisao e cota",true);y-=16;
  row("Precisao H (m)",E.hr?`min ${br3(E.hr.min)}  med ${br3(E.hr.med)}  max ${br3(E.hr.max)}`:"-");
  row("Precisao V (m)",E.vr?`min ${br3(E.vr.min)}  med ${br3(E.vr.med)}  max ${br3(E.vr.max)}`:"-");
  row("Cota (m)",E.ct?`min ${br3(E.ct.min)}  med ${br3(E.ct.med)}  max ${br3(E.ct.max)}`:"-");
  if(E.pf){row("Profundidade (m)",`min ${br3(E.pf.min)}  med ${br3(E.pf.med)}  max ${br3(E.pf.max)}`);
    row("Cota do fundo (m)",E.cf?`min ${br3(E.cf.min)}  max ${br3(E.cf.max)}`:"-")}
  y-=6;c+=T(M,y,12,"Extensao",true);y-=16;
  row("E (m)",`${br3(E.Emin)}  a  ${br3(E.Emax)}`);
  row("N (m)",`${br3(E.Nmin)}  a  ${br3(E.Nmax)}`);
  row("Distancia percorrida",br3(E.dist,1)+" m");
  // croqui do percurso
  y-=10;const bx=M,by=60,bw=W-2*M,bh=y-70;
  if(bh>120){c+="0.6 G 0.6 w "+`${bx} ${by} ${bw} ${bh} re S\n`+T(bx+6,by+bh-14,10,"Percurso",true);
    const dx=E.Emax-E.Emin||1,dy=E.Nmax-E.Nmin||1,esc_=Math.min((bw-50)/dx,(bh-50)/dy),cx=bx+bw/2-(E.Emin+E.Emax)/2*esc_,cy=by+bh/2-(E.Nmin+E.Nmax)/2*esc_;
    c+="0 0.35 0.7 RG 1 w\n";let first=true;
    const passo=Math.max(1,Math.floor(rows.length/1500));
    for(let i=0;i<rows.length;i+=passo){const px=cx+rows[i].E*esc_,py=cy+rows[i].N*esc_;c+=`${px.toFixed(1)} ${py.toFixed(1)} ${first?"m":"l"}\n`;first=false}
    c+="S\n"}
  c+=T(M,30,8,"Gerado pelo WA Survey - os dados completos (1 ponto/s) estao no arquivo CSV desta gravacao.");
  const objs=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>`,
    `<< /Length ${c.length} >>\nstream\n${c}endstream`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  let out="%PDF-1.4\n";const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`;
  return latin1(out);
}
async function compartilharSessao(sess,qual,baixar){
  const caminho=qual==="pdf"?sess.arqPdf:sess.arq;if(!caminho){toast("Arquivo não disponível");return}
  if(baixar){try{const r=await NP.GnssTcp.saveToDownloads({path:caminho,mime:qual==="pdf"?"application/pdf":"text/csv"});bip("ok");toast("Salvo em "+r.where)}catch(e){toast("Não consegui salvar: "+(e.message||e))}return}
  try{await NP.GnssTcp.shareFiles({files:[{path:caminho,dir:"data"}],mime:qual==="pdf"?"application/pdf":"text/csv",title:"Enviar "+caminho.split("/").pop()})}catch(e){if(!String(e.message||e).includes("cancel"))toast("Não consegui compartilhar: "+(e.message||e))}
}
async function apagarSessao(sess){
  if(NATIVO){for(const c of [sess.arq,sess.arqPdf])if(c)try{await NP.Filesystem.deleteFile({path:c,directory:"DATA"})}catch(e){}}
  S.nmeaSessoes=(S.nmeaSessoes||[]).filter(x=>x.id!==sess.id);salvar();render();toast("Gravação apagada");
}
function nmeaCelular(){
  const hh=new Date().toISOString().slice(11,19).replace(/:/g,"")+".00",dt=new Date().toISOString();
  const dm=(v,d)=>{const a=Math.abs(v),g=Math.floor(a),m=(a-g)*60;return String(g).padStart(d,"0")+m.toFixed(5).padStart(8,"0")};
  const cs=b=>{let c=0;for(const ch of b)c^=ch.charCodeAt(0);return `$${b}*${c.toString(16).toUpperCase().padStart(2,"0")}`};
  const NS=G.lat<0?"S":"N",EW=G.lon<0?"W":"E",la=dm(G.lat,2),lo=dm(G.lon,3),kn=(G.vel||0)/0.514444;
  const L=[];
  if(S.sent.GGA)L.push(cs(`GPGGA,${hh},${la},${NS},${lo},${EW},1,${G.sats||8},${br(Math.max(G.hrms/5,0.8),1).replace(",",".")},${(G.h||0).toFixed(3)},M,0.0,M,,`));
  if(S.sent.RMC)L.push(cs(`GPRMC,${hh},A,${la},${NS},${lo},${EW},${kn.toFixed(2)},${(G.course||0).toFixed(1)},${dt.slice(8,10)}${dt.slice(5,7)}${dt.slice(2,4)},,,A`));
  if(S.sent.VTG)L.push(cs(`GPVTG,${(G.course||0).toFixed(1)},T,,M,${kn.toFixed(2)},N,${(kn*1.852).toFixed(2)},K,A`));
  if(S.sent.GST)L.push(cs(`GPGST,${hh},${G.hrms.toFixed(3)},${(G.hrms/1.41).toFixed(3)},${(G.hrms/1.41).toFixed(3)},0.0,${(G.hrms/1.41).toFixed(3)},${(G.hrms/1.41).toFixed(3)},${(G.vrms||G.hrms*1.5).toFixed(3)}`));
  if(S.sent.ZDA)L.push(cs(`GPZDA,${hh},${dt.slice(8,10)},${dt.slice(5,7)},${dt.slice(0,4)},00,00`));
  G.nmea=G.nmea.concat(L).slice(-40);
  if(NATIVO&&S.servidor&&L.length)NP.GnssTcp.serverSend({data:L.join("\r\n")+"\r\n"}).catch(()=>{});
}
function tickReal(now){
  if(G.fix>0&&!isNaN(G.lat)&&(!R.ultPosT||now-R.ultPosT>60000)){R.ultPosT=now;S.ultPos={lat:G.lat,lon:G.lon};salvar()}
  if(S.fonte==="celular"&&now-R.ultimo<5000)nmeaCelular();
  mockTick();
  if(NATIVO&&S.corrLigada&&(G.fix===4||G.fix===5)&&S.fonte==="tcp"){S.envRx=S.envRx||{};const k=chaveRx(),e=R.envUsado||envAtual();if(S.envRx[k]!==e){S.envRx[k]=e;salvar()}}
  if(semUsoCorrecao()&&!R.roverForcado&&!S.drLigado&&receptorReal()&&!modoSimples()&&!["trimble","spectra"].includes(marcaRx())&&Date.now()-S.corrDesde>20000){
    R.roverForcado=true;S.corrDesde=Date.now();toast("O receptor não está usando a correção (pode ter ficado como base). Mandando os comandos de rover…");
    enviarLista(cmdsRoverPDA(),"Voltar para rover",120).then(()=>{S.rxBase=false;S.baseLigada=false;S.modo="rover";S.corrDesde=Date.now();salvar();render()})}
  else if(semUsoCorrecao()&&marcaRx()!=="trimble"&&(R.envTrocas||0)<6&&Date.now()-S.corrDesde>20000){R.envTrocas=(R.envTrocas||0)+1;S.cnEnv=(R.envUsado||envAtual())==="raw"?"vd":"raw";R.envUsado=S.cnEnv;
    NP.GnssTcp.setEnvelope({mode:S.cnEnv}).catch(()=>{});S.corrDesde=Date.now();toast("O receptor não aceitou a correção. Trocando o formato para "+(S.cnEnv==="vd"?"ComNav ($$VD)":"RTCM direto")+"…")}
  if(S.fonte==="tcp"&&now-R.ultimo>5000)G.fix=0;
  avisoSolucao();
  if(S.est.gravando&&+S.est.duracao>0&&(now-S.est.inicio)/60000>=+S.est.duracao&&(S.est.destino!=="receptor"||noReceptorGravando()))pararEstaticoCN(true);
  render(false);
}

licIniciar();
