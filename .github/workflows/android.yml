name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android
        run: |
          npx cap add android
          VERSION_CODE=${{ github.run_number }} bash scripts/patch-android.sh
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ColetoraGNSS-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ColetoraGNSS-APK
          path: ColetoraGNSS-*.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Coletora GNSS 1.0.${{ github.run_number }}
          body: |
            APK para instalar no Android.
            Baixe o arquivo ColetoraGNSS-1.0.${{ github.run_number }}.apk abaixo e abra no celular.
          files: ColetoraGNSS-*.apk
