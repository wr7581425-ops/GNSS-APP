name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Marcar versão no app
        run: |
          sed -i "s/__VERSAO__/1.0.${{ github.run_number }}/g; s|__DATA__|$(TZ=America/Manaus date '+%d/%m/%Y %H:%M')|g" www/index.html

      - name: Gerar projeto Android
        run: |
          npx cap add android
          VERSION_CODE=${{ github.run_number }} bash scripts/patch-android.sh
          npx cap sync android

      - name: Chave fixa de assinatura (permite atualizar por cima)
        run: |
          mkdir -p ~/.android
          cp assinatura/wasurvey.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WASurvey-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WASurvey-APK
          path: WASurvey-*.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WA Survey 1.0.${{ github.run_number }}
          body: |
            APK para instalar no Android.
            Baixe o arquivo WASurvey-1.0.${{ github.run_number }}.apk abaixo e abra no celular.
          files: WASurvey-*.apk

      - name: Publicar no repositório público de atualizações (o app procura as versões novas lá)
        env:
          TOKEN_ATUALIZACOES: ${{ secrets.ATUALIZACOES_TOKEN }}
        run: |
          if [ -z "$TOKEN_ATUALIZACOES" ]; then echo "::error::Falta o secret ATUALIZACOES_TOKEN"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          repository: wr7581425-ops/WA-Survey-Atualizacoes
          token: ${{ secrets.ATUALIZACOES_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: WA Survey 1.0.${{ github.run_number }}
          body: |
            APK do WA Survey para Android.
            Baixe o arquivo WASurvey-1.0.${{ github.run_number }}.apk abaixo e abra no celular.
          files: WASurvey-*.apk
