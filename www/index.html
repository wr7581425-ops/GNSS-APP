<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1720">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Coletora GNSS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de campo em uma coluna, barra de status no topo, navegação embaixo. Tema escuro único por escolha (leitura no sol). */
:root{
  --bg:#0F1720; --panel:#17212C; --panel2:#131C26; --line:#263241; --fg:#E8EEF4; --muted:#9FB0C2;
  --accent:#FF8A1F; --accent-ink:#1A0E02; --accent-bg:#2A1A0A; --fix:#3DDC84; --fix-bg:#12301F; --float:#FFC24B; --float-bg:#33270A; --bad:#FF6B5E; --bad-bg:#3A1512;
  --ui:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--ui)}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ttl{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.c-fix{color:var(--fix);background:var(--fix-bg)}.c-float{color:var(--float);background:var(--float-bg)}.c-off{color:var(--muted);background:var(--panel)}.c-bad{color:var(--bad);background:var(--bad-bg)}
main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border:2px solid var(--accent)}
.card h3{margin:0;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ring{width:84px;height:84px;flex:0 0 84px;border-radius:50%;border:6px solid var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:21px}.ring small{font-size:11px;color:var(--muted)}
.coords{display:grid;grid-template-columns:26px 1fr;row-gap:6px;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.coords i{font-style:normal;color:var(--accent);font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:600 16px var(--ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;height:46px;padding:0 12px;width:100%;min-width:0}
input.m,.m{font-family:var(--mono)}
input[type=checkbox]{width:22px;height:22px;height:22px;accent-color:var(--accent);padding:0}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fg)}
button{font:700 16px var(--ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:0 14px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.big{min-height:64px;font-size:20px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px}
.opt small{font-size:12px;font-weight:500;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-bg)}
.opt[aria-pressed="true"] small{color:#FFB066}
.subtabs{display:flex;gap:6px;overflow-x:auto}
.subtabs button{min-height:40px;font-size:14px;font-weight:600;flex:0 0 auto}
.subtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel2);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom button{border:0;border-radius:0;background:transparent;color:var(--muted);font-size:13px;padding:0 2px;font-weight:600;min-height:58px}
nav.bottom button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.bottom button{min-height:62px!important;font-size:12px!important}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.row:last-child{border-bottom:0}
.muted{color:var(--muted)}.small{font-size:13px}
.st-fix{color:var(--fix);font-weight:700}.st-float{color:var(--float);font-weight:700}
.monitor{background:#0A1118;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 11px/1.6 var(--mono);color:#8FD6A8;height:120px;overflow:auto;white-space:pre}
.proj{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px 16px;font-weight:500}
.proj[aria-pressed="true"]{border:2px solid var(--accent)}
textarea{width:100%;min-height:150px;background:#0A1118;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:500 12px var(--mono)}
.banner{background:var(--float-bg);border:1px solid var(--float);color:#FFE3A3;border-radius:10px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <button type="button" id="hBack" data-act="voltar" aria-label="Voltar" hidden style="min-height:40px;width:40px;padding:0;flex:0 0 40px;font-size:22px;line-height:1">‹</button>
    <div style="display:flex;flex-direction:column;min-width:0;flex:1">
      <span class="eyebrow" id="hEyebrow">Receptor</span>
      <span class="ttl" id="hTitle">Nenhum conectado</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center"><span class="chip c-off" id="hChip">Desconectado</span><button type="button" data-go="config" aria-label="Configurações" style="min-height:40px;width:40px;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>

  <main id="view"></main>

  <nav class="bottom" aria-label="Navegação principal">
    <button type="button" data-aba="projeto" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Projeto</button>
    <button type="button" data-aba="dispositivo" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v2c0 1.7 3.1 3 7 3s7-1.3 7-3V6M12 11v10"/></svg>Dispositivo</button>
    <button type="button" data-aba="levantamento" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Levantamento</button>
    <button type="button" data-aba="ferramentas" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Ferramentas</button>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- Estado ----------
const KEY="coletora-gnss-v1";
const S={
  tela:"home", aba:"levantamento", sub:"conexao",
  receptores:[{id:1,marca:"ComNav",modelo:"S6",serie:"S6-2210-48731",nivel:"completo"},{id:2,marca:"CHC",modelo:"i73",serie:"I73-0091-22410",nivel:"completo"},{id:3,marca:"Trimble",modelo:"R10",serie:"",nivel:"leitura"}],
  ativo:1, conexao:"wifi", ip:"192.168.1.1", porta:"9902", conectado:false, conectando:false, desde:0,
  modo:"rover", mascara:"10", taxa:"1", pdopMax:"4,0",
  correcao:"ntrip", caster:"rbmc-ip.ibge.gov.br", cport:"2101", mount:"MAN10", user:"", senha:"", enviaGGA:true, freq:"463.125", canal:"3", proto:"TRIMTALK",
  corrLigada:false, corrDesde:0,
  sent:{GGA:true,RMC:true,VTG:true,GST:true,GSA:false,ZDA:false}, hz:"5", servidor:false, sport:"5017",
  projetos:[{id:1,nome:"Loteamento Tarumã",cliente:"Construtora Rio Negro",pontos:[]}], projAtivo:1,
  codigo:"MF", altura:"2,000", soFix:true, tolH:"0,020", epocas:"5", coletando:0,
  baseModo:"atual", baseE:"", baseN:"", baseH:"", baseAnt:"1,800", baseFmt:"RTCM 3.2 MSM4", baseId:"0001", baseSaida:"radio", baseLigada:false, baseMedindo:0, baseFonte:"",
  zoom:20, seguir:true, anda:false, mapCE:null, mapCN:null, loc:null, locPick:false, locTol:"0,030",
  baseInicio:0, baseProv:null, ajuste:null, semInternet:false,
  est:{gravando:false,inicio:0,nome:"EST-01",taxa:"15",destino:"receptor",formato:"RINEX 3.04",altAnt:"1,800",medida:"Base da rosca",duracao:"60",mascara:"10"},
  arquivos:[],
  cfg:{dec:"3",sepDec:"virgula",ang:"gms",prefixo:"",digitos:"2",cfgVer:2,somColeta:true,vibrar:true,somFix:true,locVibrar:true,locSom:true,locRaio:"5",rotuloMapa:"num",idadeMax:"5",estacaInt:"20",csvSep:",",cabecalho:true,
       nomesMapa:true,tamPonto:"5",seguirPadrao:true,fonte:"normal",telaLigada:true,tolV:"0,040",pdopAlerta:"4,0",formatoPadrao:"csv",fundoMapa:"sat",unidadeArea:"m2"},
};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s){for(const k of ["receptores","ativo","projetos","projAtivo","ip","porta","caster","cport","mount","user","codigo","altura","soFix","tolH","epocas","sport","hz","sent","conexao","correcao","arquivos"])if(s[k]!==undefined)S[k]=s[k];
  if(s.cfg){S.cfg=Object.assign(S.cfg,s.cfg);if(!s.cfg.cfgVer){if(S.cfg.prefixo==="P-")S.cfg.prefixo="";if(S.cfg.digitos==="4")S.cfg.digitos="2";if(S.cfg.fundoMapa==="grade")S.cfg.fundoMapa="sat";S.cfg.cfgVer=2}}if(s.est)S.est=Object.assign(S.est,s.est,{gravando:false})}}catch(e){}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// ---------- Simulador do receptor ----------
const G={fix:0,sats:0,pdop:9.9,hrms:9,vrms:9,lat:-3.10207,lon:-60.02553,E:0,N:0,h:42.316,idade:0,course:35,vel:0,const:{GPS:9,GLONASS:6,Galileo:5,BeiDou:4},nmea:[]};
// ---------- Sistema de coordenadas (por projeto) ----------
const SIS_PADRAO={datum:"SIRGAS 2000",proj:"UTM",zona:"auto",hemi:"S"};
function sis(){const p=S.projetos.find(p=>p.id===S.projAtivo);return Object.assign({},SIS_PADRAO,p?.sis||{})}
function zonaDe(lon){return Math.floor((lon+180)/6)+1}
function zonaAtual(){const s=sis();return s.zona==="auto"?zonaDe(G.lon):+s.zona}
function hemiAtual(){const s=sis();return s.hemi==="auto"?(G.lat<0?"S":"N"):s.hemi}
function toUTM(lat,lon,zona,hemi){ // GRS80 (SIRGAS 2000) ~ WGS 84
  const a=6378137,f=1/298.257222101,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2),d=Math.PI/180;
  const L=lat*d,lam0=((zona-1)*6-180+3)*d,N=a/Math.sqrt(1-e2*Math.sin(L)**2),T=Math.tan(L)**2,C=ep2*Math.cos(L)**2,A=Math.cos(L)*(lon*d-lam0);
  const M=a*((1-e2/4-3*e2**2/64-5*e2**3/256)*L-(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*L)+(15*e2**2/256+45*e2**3/1024)*Math.sin(4*L)-(35*e2**3/3072)*Math.sin(6*L));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let Nn=k0*(M+N*Math.tan(L)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  if(hemi==="S")Nn+=10000000;return [E,Nn];
}
function atualizaEN(){[G.E,G.N]=toUTM(G.lat,G.lon,zonaAtual(),hemiAtual())}
function ptEN(p){if(p.lat===undefined)return [p.E,p.N];return toUTM(p.lat,p.lon,zonaAtual(),hemiAtual())}
function sisTxt(){const s=sis();return s.proj==="UTM"?`${s.datum} · UTM ${zonaAtual()}${hemiAtual()}${s.zona==="auto"?" (auto)":""}`:`${s.datum} · Geográficas`}
function gms(v,pos,neg){const a=Math.abs(v),g=Math.floor(a),m=Math.floor((a-g)*60),s=((a-g)*60-m)*60;return `${g}°${String(m).padStart(2,"0")}'${s.toFixed(4).padStart(7,"0").replace(".",",")}" ${v<0?neg:pos}`}
function coordsHTML(lat,lon,E,N,h){
  const s=sis();
  if(s.proj==="UTM")return `<i>E</i><span>${br(E,dc())}</span><i>N</i><span>${br(N,dc())}</span><i>h</i><span>${br(h,dc())} m</span>`;
  if(s.proj==="GMS")return `<i>φ</i><span style="font-size:17px">${gms(lat,"N","S")}</span><i>λ</i><span style="font-size:17px">${gms(lon,"E","W")}</span><i>h</i><span>${br(h)} m</span>`;
  return `<i>φ</i><span>${br(lat,8)}°</span><i>λ</i><span>${br(lon,8)}°</span><i>h</i><span>${br(h)} m</span>`;
}
atualizaEN();
const FIXNOME=["SEM SINAL","AUTÔNOMO","DGPS","","RTK FIX","RTK FLOAT"];
function tick(){
  const now=Date.now();
  if(!S.conectado){G.fix=0;G.sats=0;G.prevFix=0;render(false);return}
  if(S.fonte&&S.fonte!=="sim"){tickReal(now);return}
  const t=(now-S.desde)/1000;
  G.sats=t<3?Math.min(24,Math.floor(t*8)):22+Math.round(Math.random()*3);
  if(!S.corrLigada) G.fix=G.sats>4?1:0;
  else{const c=(now-S.corrDesde)/1000;G.fix=c<3?1:c<9?5:4}
  if(G.prevFix===4&&G.fix!==4){bip("fix");toast("Atenção: perdeu o FIX")}
  if(G.prevFix!==4&&G.fix===4&&G.prevFix!==undefined&&S.cfg.somFix)bip("ok");
  G.prevFix=G.fix;
  if(S.est.gravando&&+S.est.duracao>0&&(now-S.est.inicio)/60000>=+S.est.duracao)pararEstatico(true);
  const base={0:9,1:1.8,5:0.25,4:0.008}[G.fix]||1;
  G.hrms=+(base*(0.8+Math.random()*0.4)).toFixed(3);G.vrms=+(G.hrms*1.7).toFixed(3);
  G.pdop=+(1.1+Math.random()*0.3).toFixed(1);
  const j=G.hrms*0.6;let dE=(Math.random()-0.5)*j,dN=(Math.random()-0.5)*j;G.h+= (Math.random()-0.5)*j*1.5;
  if(S.anda){
    let v=0.9;const al=alvoEN();
    if(al){const de=al.E-G.E,dn=al.N-G.N,dist=Math.hypot(de,dn);G.course=(Math.atan2(de,dn)*180/Math.PI+(Math.random()-0.5)*(dist>3?16:4)+360)%360;v=Math.min(0.9,dist*0.45)}
    else G.course=(G.course+(Math.random()-0.5)*18+360)%360;
    const r=G.course*Math.PI/180;dE+=Math.sin(r)*v;dN+=Math.cos(r)*v;G.vel=v}else G.vel=0;
  G.lat+=dN/111320;G.lon+=dE/(111320*Math.cos(G.lat*Math.PI/180));atualizaEN();
  G.idade=S.corrLigada?+(0.8+Math.random()*0.6).toFixed(1):0;
  // NMEA GGA a partir de lat/lon aproximados
  const lat=G.lat, lon=G.lon;
  const hh=new Date().toISOString().slice(11,19).replace(/:/g,"")+".00";
  const dm=(v,d)=>{const a=Math.abs(v),g=Math.floor(a),m=(a-g)*60;return String(g).padStart(d,"0")+m.toFixed(5).padStart(8,"0")};
  const cs=s=>{let c=0;for(const ch of s)c^=ch.charCodeAt(0);return c.toString(16).toUpperCase().padStart(2,"0")};
  const q={0:0,1:1,5:5,4:4}[G.fix];
  const lines=[];
  if(S.sent.GGA){const b=`GNGGA,${hh},${dm(lat,2)},S,${dm(lon,3)},W,${q},${G.sats},${G.pdop.toFixed(1)},${G.h.toFixed(3)},M,-12.4,M,${G.idade||""},0001`;lines.push(`$${b}*${cs(b)}`)}
  if(S.sent.RMC){const b=`GNRMC,${hh},A,${dm(lat,2)},S,${dm(lon,3)},W,0.02,0.0,271026,,,R`;lines.push(`$${b}*${cs(b)}`)}
  if(S.sent.GST){const b=`GNGST,${hh},0.011,${G.hrms.toFixed(3)},${G.hrms.toFixed(3)},82.3,${G.hrms.toFixed(3)},${G.hrms.toFixed(3)},${G.vrms.toFixed(3)}`;lines.push(`$${b}*${cs(b)}`)}
  if(S.sent.VTG){const b=`GNVTG,0.0,T,,M,0.02,N,0.04,K,D`;lines.push(`$${b}*${cs(b)}`)}

function bip(tipo){

    const notas=tipo==="ok"?[[1320,0,.09],[1760,.13,.12]]:tipo==="erro"?[[330,0,.35]]:[[880,0,.15],[660,.2,.15],[880,.4,.15]];

const ESPERA_PPP=150; // minutos após o fim do rastreio (processamento GPS com órbitas ultrarrápidas)
function sAjuste(){
  const A=S.ajuste, now=Date.now();
  const net=`<label class="ck small"><input type="checkbox" id="semNet" ${S.semInternet?"checked":""}> Simular sem internet no local</label>`;
  if(!S.baseLigada&&!A) return `<section class="card"><h3>Ajuste de base no mesmo dia</h3>
    <span class="muted small">1. Em Base/Rover, pegue a <b>posição atual</b> da base e toque em Iniciar base. A gravação RINEX começa junto.<br>2. Colete normalmente com o rover.<br>3. Encerre o rastreio aqui: o app envia ao IBGE-PPP e, quando a coordenada corrigida chegar, aplica a correção na base e em todos os pontos do dia.</span>
    <button class="pri" data-sub="baserover">Ir para Base/Rover</button></section>
    ${manualAjuste()}`;
  if(A&&!A.prov&&A.status==="gravando") return `<section class="card"><h3>Base em coordenada conhecida</h3><span class="muted small">Esta base foi iniciada com ${esc(S.baseFonte||"coordenada digitada")}. Não precisa de ajuste. Se mesmo assim quiser conferir pelo IBGE, encerre o rastreio abaixo.</span>
    <button data-act="ajEncerrar">Encerrar rastreio e enviar ao IBGE-PPP</button></section>`;
  const prov=S.baseProv, nPts=pontosDesde(S.baseInicio).length;
  let corpo="";
  if(A.status==="gravando"){const t=(now-S.baseInicio)/1000,mb=t/15*7/1024;
    corpo=`<section class="card hl"><div class="split"><h3>Rastreando a base</h3><span class="st-fix small">● GRAVANDO</span></div>
      <div class="grid2"><div class="kv"><span>Tempo</span><b>${dur(t)}</b></div><div class="kv"><span>Arquivo RINEX (15 s)</span><b>${br(mb,2)} MB</b></div>
      <div class="kv"><span>Início</span><b>${hm(S.baseInicio)}</b></div><div class="kv"><span>Pontos coletados</span><b>${nPts}</b></div></div>
      ${t<3600?`<div class="banner">O IBGE recomenda pelo menos 1 hora de rastreio para precisão centimétrica. Faltam ${dur(3600-t)}.</div>`:`<span class="st-fix small">Tempo mínimo atingido.</span>`}
      <span class="muted small">Enquanto isso, faça só <b>coleta</b>. A locação deve esperar o ajuste.</span>
      ${net}
      <button class="pri" data-act="ajEncerrar">Encerrar rastreio e enviar ao IBGE-PPP</button></section>`}
  if(A.status==="fila") corpo=`<section class="card" style="border-color:var(--float)"><h3>Na fila de envio</h3>
      <span class="muted small">Rastreio encerrado às ${hm(A.fim)} (${dur((A.fim-S.baseInicio)/1000)}). Sem internet agora: o arquivo será enviado sozinho assim que o celular pegar sinal.</span>${net}</section>`;
  if(A.status==="aguardando"){const pronto=A.fim+ESPERA_PPP*60000,falta=(pronto-now)/1000;
    corpo=`<section class="card hl"><h3>Enviado ao IBGE-PPP</h3>
      <div class="grid2"><div class="kv"><span>Enviado</span><b>${hm(A.enviado)}</b></div><div class="kv"><span>Processa a partir de</span><b>${hm(pronto)}</b></div></div>
      <span class="muted small">${falta>0?`Aguardando órbitas · faltam ${dur(falta)}. O app consulta o IBGE sozinho e avisa quando chegar.`:"Consultando o resultado…"}</span>
      <button data-act="ajSimular">Simular: o IBGE respondeu agora</button></section>`}
  if(A.status==="processado"||A.status==="aplicado"){const c=A.corr,dE=c.E-prov.E,dN=c.N-prov.N,dh=c.h-prov.h;
    corpo=`<section class="card ${A.status==="aplicado"?"":"hl"}" ${A.status==="aplicado"?`style="background:var(--fix-bg);border-color:var(--fix)"`:""}>
      <div class="split"><h3>${A.status==="aplicado"?"Ajuste aplicado ✓":"Coordenada corrigida recebida"}</h3><span class="muted small">${esc(A.origem)}</span></div>
      <div class="tbl" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums">
        <tr><th style="text-align:left;color:var(--muted);padding:4px 0"></th><th style="text-align:right;color:var(--muted)">Provisória</th><th style="text-align:right;color:var(--muted)">Corrigida</th><th style="text-align:right;color:var(--muted)">Diferença</th></tr>
        <tr><td>E</td><td class="m" style="text-align:right">${br(prov.E)}</td><td class="m" style="text-align:right">${br(c.E)}</td><td class="m" style="text-align:right;color:var(--accent)">${dE>=0?"+":""}${br(dE)}</td></tr>
        <tr><td>N</td><td class="m" style="text-align:right">${br(prov.N)}</td><td class="m" style="text-align:right">${br(c.N)}</td><td class="m" style="text-align:right;color:var(--accent)">${dN>=0?"+":""}${br(dN)}</td></tr>
        <tr><td>h</td><td class="m" style="text-align:right">${br(prov.h)}</td><td class="m" style="text-align:right">${br(c.h)}</td><td class="m" style="text-align:right;color:var(--accent)">${dh>=0?"+":""}${br(dh)}</td></tr>
      </table></div>
      ${c.sig?`<span class="muted small">Precisão informada (1σ): E ${br(c.sig[0])} · N ${br(c.sig[1])} · h ${br(c.sig[2])} m</span>`:""}
      ${A.status==="aplicado"?`<span class="small" style="color:#CDEFD9">${A.nAplic} pontos e a base foram transladados às ${hm(A.aplicado)}. O receptor da base já recebeu a coordenada nova. Pode locar.</span>`
        :`<span class="small">Deslocamento horizontal: <b>${br(Math.hypot(dE,dN))} m</b>. Ao aplicar, a base e os <b>${nPts} pontos</b> coletados desde ${hm(S.baseInicio)} são corrigidos, e a coordenada nova é enviada ao receptor da base.</span>
         <button class="pri" data-act="ajAplicar">Aplicar ajuste em ${nPts} pontos e na base</button>`}
    </section>`}
  return corpo+(A.status!=="aplicado"?manualAjuste():"")+(A.status==="aplicado"?`<button data-act="ajNovo">Iniciar nova sessão de base</button>`:"");

let ultPulso=0,chegouAviso=false;
setInterval(()=>{
  if(!S.loc||!S.conectado){chegouAviso=false;return}
  const c=S.cfg;if(!c.locVibrar&&!c.locSom)return;
  const al=alvoEN();if(!al)return;const d=Math.hypot(al.E-G.E,al.N-G.N),tol=num(S.locTol)||0.03,raio=num(c.locRaio)||5,now=Date.now();
  if(d<=tol){if(!chegouAviso){chegouAviso=true;if(c.locVibrar)vib([500,100,500],true);if(c.locSom)tom(1760,.4)}return}
  chegouAviso=false;if(d>raio)return;
  const per=Math.max(120,Math.min(1600,120+d/raio*1480));
  if(now-ultPulso>=per){ultPulso=now;if(c.locVibrar)vib(35,true);if(c.locSom)tom(700+(1-d/raio)*900,.05)}
},60);
function tom(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d+.02)}catch(e){}}

function parseAng(s){s=String(s||"").trim();if(!s)return NaN;const p=s.replace(/[°'"’”]/g," ").replace(",",".").trim().split(/\s+/).map(Number);if(p.some(isNaN))return NaN;return p.length===1?p[0]:p[0]+(p[1]||0)/60+(p[2]||0)/3600}
function delaunay(P){ // Bowyer-Watson
  const n=P.length;if(n<3)return [];let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;for(const p of P){minx=Math.min(minx,p.E);miny=Math.min(miny,p.N);maxx=Math.max(maxx,p.E);maxy=Math.max(maxy,p.N)}
  const dm=Math.max(maxx-minx,maxy-miny)*20,mx=(minx+maxx)/2,my=(miny+maxy)/2;
  const V=P.map(p=>({x:p.E,y:p.N})).concat([{x:mx-dm,y:my-dm},{x:mx,y:my+dm},{x:mx+dm,y:my-dm}]);
  const cc=(a,b,c)=>{const A=V[a],B=V[b],C=V[c],d=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y));const ux=((A.x**2+A.y**2)*(B.y-C.y)+(B.x**2+B.y**2)*(C.y-A.y)+(C.x**2+C.y**2)*(A.y-B.y))/d,uy=((A.x**2+A.y**2)*(C.x-B.x)+(B.x**2+B.y**2)*(A.x-C.x)+(C.x**2+C.y**2)*(B.x-A.x))/d;return {x:ux,y:uy,r:(A.x-ux)**2+(A.y-uy)**2}};
  let T=[[n,n+1,n+2]].map(t=>({t,c:cc(...t)}));
  for(let i=0;i<n;i++){const p=V[i],bad=T.filter(o=>(p.x-o.c.x)**2+(p.y-o.c.y)**2<o.c.r);const ed=[];
    for(const o of bad)for(const [a,b] of [[o.t[0],o.t[1]],[o.t[1],o.t[2]],[o.t[2],o.t[0]]]){const k=ed.findIndex(e=>(e[0]===b&&e[1]===a)||(e[0]===a&&e[1]===b));if(k>=0)ed.splice(k,1);else ed.push([a,b])}
    T=T.filter(o=>!bad.includes(o));for(const [a,b] of ed)T.push({t:[a,b,i],c:cc(a,b,i)})}
  return T.map(o=>o.t).filter(t=>t.every(v=>v<n));
}
function calcVolume(ps,ref){
  const tris=delaunay(ps);let corte=0,aterro=0,area=0;const K=8;
  for(const [a,b,c] of tris){const A=ps[a],B=ps[b],C=ps[c];const ar=Math.abs((B.E-A.E)*(C.N-A.N)-(C.E-A.E)*(B.N-A.N))/2;area+=ar;
    let sp=0,sn=0,cnt=0;for(let i=0;i<=K;i++)for(let j=0;j<=K-i;j++){const k=K-i-j,dz=(A.h*i+B.h*j+C.h*k)/K-ref;if(dz>0)sp+=dz;else sn+=-dz;cnt++}
    corte+=ar*sp/cnt;aterro+=ar*sn/cnt}
  return {corte,aterro,area,n:tris.length,tris};
}

function tileLayer(fundo,X,Y,W,H,mpp){
  const z0=zonaAtual(),h0=hemiAtual();
  const [la1,lo1]=fromUTM(S.mapCE-W/2*mpp,S.mapCN+H/2*mpp,z0,h0),[la2,lo2]=fromUTM(S.mapCE+W/2*mpp,S.mapCN-H/2*mpp,z0,h0);
  const latC=(la1+la2)/2;let z=Math.round(Math.log2(156543.03*Math.cos(latC*Math.PI/180)/mpp));z=Math.max(3,Math.min(fundo==="sat"?18:19,z));
  const n=2**z,tx=lo=>Math.floor((lo+180)/360*n),ty=la=>{const r=la*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)};
  const lon=x=>x/n*360-180,lat=y=>Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;
  const x1=tx(Math.min(lo1,lo2)),x2=tx(Math.max(lo1,lo2)),y1=ty(Math.max(la1,la2)),y2=ty(Math.min(la1,la2));
  if((x2-x1+1)*(y2-y1+1)>64)return "";
  let out="";
  for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++){
    const [eA,nA]=toUTM(lat(y),lon(x),z0,h0),[eB,nB]=toUTM(lat(y+1),lon(x+1),z0,h0);
    const px=X(eA),py=Y(nA),w=X(eB)-px,h=Y(nB)-py;
    const url=fundo==="sat"?`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`:`https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
    out+=`<image href="${url}" x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${(w+0.6).toFixed(1)}" height="${(h+0.6).toFixed(1)}" preserveAspectRatio="none"/>`;
  }
  return out;
}

function vMapa(){
  const pts=proj()?.pontos||[];
  if(S.seguir||S.mapCE===null){S.mapCE=G.E;S.mapCN=G.N}
  const W=360,H=420,mpp=S.zoom/100; // metros por pixel
  const X=e=>W/2+(e-S.mapCE)/mpp, Y=n=>H/2-(n-S.mapCN)/mpp;
  const passos=[1,2,5,10,20,50,100,200,500,1000];const gstep=passos.find(s=>s/mpp>=60)||1000;
  let grid="";const e0=Math.floor((S.mapCE-W/2*mpp)/gstep)*gstep,n0=Math.floor((S.mapCN-H/2*mpp)/gstep)*gstep;
  const fundo=S.cfg.fundoMapa||"sat",gcor=fundo==="grade"?"#263241":"rgba(255,255,255,0.18)";
  for(let e=e0;e<=S.mapCE+W/2*mpp;e+=gstep)grid+=`<line x1="${X(e)}" y1="0" x2="${X(e)}" y2="${H}" stroke="${gcor}" stroke-width="1"/>`;
  for(let n=n0;n<=S.mapCN+H/2*mpp;n+=gstep)grid+=`<line x1="0" y1="${Y(n)}" x2="${W}" y2="${Y(n)}" stroke="${gcor}" stroke-width="1"/>`;
  const tiles=fundo==="grade"?"":tileLayer(fundo,X,Y,W,H,mpp);
  const pSvg=pts.map((p,i)=>{const [pe,pn]=ptEN(p);const x=X(pe),y=Y(pn);if(x<-20||x>W+20||y<-20||y>H+20)return"";return `<g data-ptsel="${i}" style="cursor:pointer">${S.ptSel===i?`<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>`:""}<circle cx="${x}" cy="${y}" r="18" fill="transparent"/><circle cx="${x}" cy="${y}" r="${+S.cfg.tamPonto||5}" fill="${p.st==="FIX"?"#3DDC84":p.st==="CALC"?"#5B9CFF":p.st==="PROJ"?"#FF8A1F":"#FFC24B"}" stroke="#0F1720" stroke-width="2"/><text x="${x+8}" y="${y-8}" fill="#E8EEF4" font-size="11" font-family="JetBrains Mono, monospace">${esc(rotulo(p))}</text></g>`}).join("");
  let base="";if(S.baseE&&S.baseN){const bx=X(num(S.baseE)),by=Y(num(S.baseN));base=`<g><rect x="${bx-7}" y="${by-7}" width="14" height="14" fill="none" stroke="#FF8A1F" stroke-width="2.5" transform="rotate(45 ${bx} ${by})"/><text x="${bx+10}" y="${by+4}" fill="#FFB066" font-size="11" font-family="Barlow, sans-serif" font-weight="700">BASE</text></g>`}
  const cx=X(G.E),cy=Y(G.N), acc=Math.min(Math.max(G.hrms/mpp,0),400);
  const cor=G.fix===4?"#3DDC84":G.fix===5?"#FFC24B":"#FF6B5E";
  const seta=S.conectado?`<circle cx="${cx}" cy="${cy}" r="${acc.toFixed(1)}" fill="${cor}" fill-opacity="0.12" stroke="${cor}" stroke-opacity="0.5"/>
    <g transform="translate(${cx} ${cy}) rotate(${G.course})"><polygon points="0,-16 11,12 0,6 -11,12" fill="${cor}" stroke="#0F1720" stroke-width="2"/></g>`:"";
  const barra=gstep/mpp;
  const al=alvoEN();let alvo="";
  if(al){const ax=X(al.E),ay=Y(al.N);alvo=`${S.conectado?`<line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="#FF8A1F" stroke-width="2" stroke-dasharray="6 5"/>`:""}<g><circle cx="${ax}" cy="${ay}" r="10" fill="none" stroke="#FF8A1F" stroke-width="2.5"/><line x1="${ax-15}" y1="${ay}" x2="${ax+15}" y2="${ay}" stroke="#FF8A1F" stroke-width="2"/><line x1="${ax}" y1="${ay-15}" x2="${ax}" y2="${ay+15}" stroke="#FF8A1F" stroke-width="2"/><text x="${ax+14}" y="${ay-12}" fill="#FFB066" font-size="12" font-weight="700" font-family="Barlow, sans-serif">${esc(al.nome)}</text></g>`}
  const poly=(ps,cor,dash)=>ps.length>=2?`<polyline points="${ps.map(p=>X(p.E)+","+Y(p.N)).join(" ")}" fill="none" stroke="${cor}" stroke-width="2.5" ${dash?`stroke-dasharray="${dash}"`:""}/>`:"";
  let linhas=linhasProj().map(l=>poly(linhaPts(l),"#E8EEF4","")).join("");
  if(S.ferr==="medir")linhas+=poly((S.medList||[]).map(getPt).filter(Boolean),"#5BE3E3","4 4");
  if(S.ferr==="linha")linhas+=poly((S.linhaPts||[]).map(getPt).filter(Boolean),"#FF8A1F","8 4");
  if(S.ferr==="area"){const ps=(S.areaList||[]).map(getPt).filter(Boolean);if(ps.length>=3)linhas+=`<polygon points="${ps.map(p=>X(p.E)+","+Y(p.N)).join(" ")}" fill="#5BE3E3" fill-opacity="0.15" stroke="#5BE3E3" stroke-width="2"/>`}
  if(S.ferr==="volume"){const ps=(S.volList||[]).map(getPt).filter(Boolean);if(ps.length>=3)linhas+=delaunay(ps).map(([a,b,c])=>`<polygon points="${[a,b,c].map(i=>X(ps[i].E)+","+Y(ps[i].N)).join(" ")}" fill="none" stroke="#5B9CFF" stroke-opacity="0.6"/>`).join("")}
  alvo=linhas+alvo;
  return `${S.loc?locPainel():""}${ptSelCard()}
  <section style="position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0B131B">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mapa com a posição atual e os pontos coletados" style="display:block;touch-action:none">

      <g transform="translate(14 ${H-18})"><rect width="${barra}" height="5" fill="#E8EEF4"/><text x="0" y="-6" fill="#E8EEF4" font-size="11" font-family="Barlow, sans-serif">${gstep} m</text></g>
      <g transform="translate(${W-26} 30)"><polygon points="0,-14 7,6 0,2 -7,6" fill="#E8EEF4"/><text x="0" y="20" fill="#E8EEF4" font-size="11" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="700">N</text></g>
    </svg>
    ${S.conectado?"":`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center" class="muted">Conecte o receptor para ver a sua posição no mapa.</div>`}
  </section>
  <div style="display:flex;gap:6px;align-items:center"><span class="muted small">Fundo:</span>${[["sat","Satélite"],["ruas","Ruas"],["grade","Grade"]].map(([v,n])=>`<button style="min-height:34px;font-size:13px;padding:0 12px" data-fundo="${v}" aria-pressed="${(S.cfg.fundoMapa||"sat")===v}" class="${(S.cfg.fundoMapa||"sat")===v?"pri":""}">${n}</button>`).join("")}</div>
  <div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <button data-act="zoomIn" aria-label="Aproximar">＋</button><button data-act="zoomOut" aria-label="Afastar">－</button>
    <button data-act="seguir" aria-pressed="${S.seguir}" class="${S.seguir?"pri":""}">${S.seguir?"Seguindo":"Seguir"}</button>
    <button data-act="verTudo">Ver tudo</button>
  </div>
  <section class="card" style="padding:10px 14px">
    <div class="grid3"><div class="kv"><span>Rumo</span><b>${S.anda?Math.round(G.course)+"°":"—"}</b></div><div class="kv"><span>Velocidade</span><b>${br(G.vel*3.6,1)} km/h</b></div><div class="kv"><span>Pontos</span><b>${pts.length}</b></div></div>
    <label class="ck small"><input type="checkbox" id="anda" ${S.anda?"checked":""}> Simular caminhada (teste da seta)</label>
  </section>
  <p class="muted small" style="margin:0">${(S.cfg.fundoMapa||"sat")==="grade"?"Fundo em grade de metros.":NATIVO?"O mapa de fundo precisa de internet (dados móveis). Sem sinal, fica a grade.":"Na página de teste o mapa de fundo não carrega; no app instalado aparece."} ${(S.cfg.fundoMapa||"sat")==="sat"?"Imagens © Esri, Maxar, Earthstar Geographics.":(S.cfg.fundoMapa==="ruas"?"© colaboradores do OpenStreetMap.":"")}</p>
  ${acoesBar()}`;
}

  const v=$("view");

function fromUTM(E,N,zona,hemi){
  const a=6378137,f=1/298.257222101,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2)),d=Math.PI/180;
  const x=E-500000,y=hemi==="S"?N-10000000:N,M=y/k0,mu=M/(a*(1-e2/4-3*e2**2/64-5*e2**3/256));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1**2/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const N1=a/Math.sqrt(1-e2*Math.sin(p1)**2),T1=Math.tan(p1)**2,C1=ep2*Math.cos(p1)**2,R1=a*(1-e2)/(1-e2*Math.sin(p1)**2)**1.5,D=x/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=((zona-1)*6-180+3)*d+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return [lat/d,lon/d];
}
function getPt(v){
  if(v==="atual")return {E:G.E,N:G.N,h:G.h-(num(S.altura)||0),nome:"Posição atual"};

function novoPonto(nome,cod,E,N,h){const [lat,lon]=fromUTM(E,N,zonaAtual(),hemiAtual());proj().pontos.push({nome,cod,lat,lon,E,N,h,h_rms:0,st:"CALC",alt:0,quando:new Date().toISOString()})}
function estaca(m){const I=num(S.cfg.estacaInt)||20,e=Math.floor(m/I+1e-9),r=m-e*I;return `Est. ${e} + ${br(r)}`}
function polyLen(ps){let L=0;for(let i=1;i<ps.length;i++)L+=Math.hypot(ps[i].E-ps[i-1].E,ps[i].N-ps[i-1].N);return L}
function polyArea(ps){let A=0;for(let i=0;i<ps.length;i++){const a=ps[i],b=ps[(i+1)%ps.length];A+=a.E*b.N-b.E*a.N}return Math.abs(A)/2}
function projNaLinha(ps,E,N){ // estaca e afastamento de (E,N) em relação à polilinha
  let best=null,acc=0;
  for(let i=1;i<ps.length;i++){const a=ps[i-1],b=ps[i],dx=b.E-a.E,dy=b.N-a.N,L=Math.hypot(dx,dy);if(!L)continue;
    let t=((E-a.E)*dx+(N-a.N)*dy)/(L*L);const tc=Math.max(0,Math.min(1,t));
    const px=a.E+tc*dx,py=a.N+tc*dy,off=((E-a.E)*dy-(N-a.N)*dx)/L; // + = direita
    const dist=Math.hypot(E-px,N-py);
    if(!best||dist<best.dist)best={dist,est:acc+tc*L,off,h:a.h+(b.h-a.h)*tc,fora:t<0||t>1};acc+=L}
  return best;
}
function pontoNaLinha(ps,est,off){

      ${de==="utm"?`<div class="grid2"><label class="f">E (m)<input class="m" inputmode="decimal" data-bind="cvE" value="${esc(S.cvE||"")}"></label><label class="f">N (m)<input class="m" inputmode="decimal" data-bind="cvN" value="${esc(S.cvN||"")}"></label>

function coletar(){
  const nome=String(proxNome()).trim(), cod=(S.codigo||"").trim(), alt=num(S.altura)||0, n=Math.max(1,parseInt(S.epocas)||5);
  if(!nome){toast("Informe o número do ponto");return}
  if((proj()?.pontos||[]).some(p=>p.nome===nome)){bip("erro");toast(`O ponto ${nome} já existe no projeto. Escolha outro número.`);return}
  S.coletando=n;const amostras=[];render();
  const iv=setInterval(()=>{
    amostras.push({lat:G.lat,lon:G.lon,E:G.E,N:G.N,h:G.h,hr:G.hrms,fix:G.fix});S.coletando--;
    if(S.coletando<=0){clearInterval(iv);
      const m=k=>amostras.reduce((s,x)=>s+x[k],0)/amostras.length;
      const hr=Math.max(...amostras.map(x=>x.hr)), tol=num(S.tolH)||0.02;
      const st=S.fonte==="celular"?"CEL":amostras.every(x=>x.fix===4)?"FIX":"FLOAT";
      if(hr>tol&&S.fonte!=="celular"){bip("erro");toast(`Ponto rejeitado: precisão ${br(hr)} m acima da tolerância`);render();return}
      proj().pontos.push({nome,cod,lat:m("lat"),lon:m("lon"),E:m("E"),N:m("N"),h:m("h")-alt,h_rms:hr,st,alt,quando:new Date().toISOString()});
      S.pNum=incNome(nome);salvar();render();bip("ok");toast(`${nome} salvo · ${br(hr)} m`);
    }else render();
  },1000);
}
function exportar(tipo){
  const p=proj();if(!p.pontos.length){exportTxt="";toast("Projeto sem pontos para exportar");return}
  const P=p.pontos.map(x=>{const [E,N]=ptEN(x);return Object.assign({},x,{E,N,lat:x.lat??(-3.10207+(x.N-9656218.907)/111320),lon:x.lon??(-60.02553+(x.E-165432.184)/111100)})});
  const cab=S.cfg.cabecalho?`# ${p.nome} · ${sisTxt()}\n`:"";
  if(tipo==="csv") exportTxt=cab+(sis().proj==="UTM"?"Nome,E,N,Cota,Codigo,PrecisaoH,Status\n"+P.map(x=>[x.nome,x.E.toFixed(3),x.N.toFixed(3),x.h.toFixed(3),x.cod,x.h_rms.toFixed(3),x.st].join(S.cfg.csvSep==="tab"?"\t":S.cfg.csvSep)).join("\n")
    :"Nome,Latitude,Longitude,AltElipsoidal,Codigo,PrecisaoH,Status\n"+P.map(x=>[x.nome,x.lat.toFixed(9),x.lon.toFixed(9),x.h.toFixed(3),x.cod,x.h_rms.toFixed(3),x.st].join(S.cfg.csvSep==="tab"?"\t":S.cfg.csvSep)).join("\n"));
  if(tipo==="dxf") exportTxt="999\n"+p.nome+" - "+sisTxt()+"\n0\nSECTION\n2\nENTITIES\n"+P.map(x=>`0\nPOINT\n8\n${x.cod||"PONTOS"}\n10\n${x.E.toFixed(3)}\n20\n${x.N.toFixed(3)}\n30\n${x.h.toFixed(3)}\n0\nTEXT\n8\nNOMES\n10\n${(x.E+0.3).toFixed(3)}\n20\n${(x.N+0.3).toFixed(3)}\n30\n0\n40\n0.5\n1\n${x.nome}`).join("\n")+"\n0\nENDSEC\n0\nEOF";
  if(tipo==="kml") exportTxt=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${p.nome}</name>\n`+P.map(x=>{const lat=x.lat,lon=x.lon;return `<Placemark><name>${x.nome}</name><description>${x.cod}</description><Point><coordinates>${lon.toFixed(8)},${lat.toFixed(8)},${x.h.toFixed(3)}</coordinates></Point></Placemark>`}).join("\n")+"\n</Document></kml>";
  toast(tipo.toUpperCase()+" gerado");
}

const NP=NATIVO?window.Capacitor.Plugins:{};
const R={buf:"",ultimo:0,ultGGA:"",ggaEnv:0,temGST:false,ntripBytes:0,ntripSt:"",ntripMsg:"",srvIps:[],clientes:[],geoId:null,mounts:[]};

function vib(ms,forcar){

// ---------- NMEA ----------
function dm2deg(v,h){if(!v)return NaN;const p=v.indexOf(".");const g=+v.slice(0,p-2),m=+v.slice(p-2);let r=g+m/60;if(h==="S"||h==="W")r=-r;return r}
function onDados(txt){
  R.buf+=txt;let i;
  while((i=R.buf.indexOf("\n"))>=0){const l=R.buf.slice(0,i).trim();R.buf=R.buf.slice(i+1);const k=l.indexOf("$");if(k>=0)nmea(l.slice(k))}
  if(R.buf.length>16000)R.buf="";
}
const TALKER={GP:"GPS",GL:"GLONASS",GA:"Galileo",GB:"BeiDou",BD:"BeiDou",GQ:"QZSS"};
function nmea(l){
  const star=l.indexOf("*"),body=l.slice(1,star>0?star:undefined);
  if(star>0){let c=0;for(const ch of body)c^=ch.charCodeAt(0);if(c!==parseInt(l.slice(star+1,star+3),16))return}
  const f=body.split(","),tal=f[0].slice(0,2),t=f[0].slice(2);
  R.ultimo=Date.now();G.nmea.push(l);if(G.nmea.length>60)G.nmea.splice(0,G.nmea.length-40);
  if(t==="GGA"){
    const q=+f[6];G.fix=q===4?4:q===5?5:q>0?1:0;G.sats=+f[7]||0;const hdop=+f[8];
    if(q>0&&f[2]){G.lat=dm2deg(f[2],f[3]);G.lon=dm2deg(f[4],f[5]);G.h=(+f[9]||0)+(+f[11]||0);atualizaEN()}
    G.idade=f[13]?+f[13]:0;R.ultGGA=l;
    if(!R.temGST&&!isNaN(hdop)){G.hrms=G.fix===4?0.01*Math.max(1,hdop):G.fix===5?0.25*hdop:1.5*hdop;G.vrms=G.hrms*1.7}
    if(!R.temGSA&&!isNaN(hdop))G.pdop=+(hdop*1.4).toFixed(1);
  }
  if(t==="GST"){const sl=+f[6],so=+f[7],sa=+f[8];if(!isNaN(sl)&&!isNaN(so)&&f[6]!==""){G.hrms=Math.sqrt(sl*sl+so*so);G.vrms=isNaN(sa)?G.hrms*1.7:sa;R.temGST=true}}
  if(t==="RMC"){const sp=(+f[7]||0)*0.514444,cr=+f[8];G.vel=sp;if(!isNaN(cr)&&f[8]!==""&&sp>0.2)G.course=cr}
  if(t==="VTG"){const cr=+f[1],kmh=+f[7];if(!isNaN(kmh))G.vel=kmh/3.6;if(!isNaN(cr)&&f[1]!==""&&G.vel>0.2)G.course=cr}
  if(t==="GSA"){const p=+f[15];if(!isNaN(p)&&p>0){G.pdop=p;R.temGSA=true}}
  if(t==="GSV"&&TALKER[tal]){G.const[TALKER[tal]]=+f[3]||0}
}

async function conectarReal(){
  if(S.conexao==="celular")return ligarGpsCelular();
  if(S.conexao==="ble"||S.conexao==="bt"){toast("Bluetooth entra na próxima versão. Use o Wi-Fi do receptor.");return}
  S.conectando=true;render();
  try{
    R.buf="";R.temGST=false;R.temGSA=false;G.nmea=[];G.const={GPS:0,GLONASS:0,Galileo:0,BeiDou:0};
    await NP.GnssTcp.connect({host:S.ip.trim(),port:parseInt(S.porta)||9902,wifi:S.conexao==="wifi"});
    S.conectando=false;S.conectado=true;S.fonte="tcp";S.desde=Date.now();R.ultimo=Date.now();render();bip("ok");toast("Receptor conectado. Aguardando dados NMEA…");
    setTimeout(()=>{if(S.conectado&&S.fonte==="tcp"&&!R.ultGGA)toast("Conectado, mas sem NMEA. Confira a porta e se a saída NMEA (GGA) está ligada no receptor.")},6000);
  }catch(e){S.conectando=false;render();bip("erro");toast("Não conectou: "+(e.message||e)+". Confira o Wi-Fi do receptor, o IP e a porta.")}
}
async function ligarGpsCelular(){
  try{
    const p=await NP.Geolocation.requestPermissions();
    if(p.location!=="granted"&&p.coarseLocation!=="granted"){toast("Permita a localização para usar o GPS do celular");return}
    R.geoId=await NP.Geolocation.watchPosition({enableHighAccuracy:true,timeout:15000,maximumAge:0},(pos,err)=>{
      if(!pos)return;const c=pos.coords;
      G.lat=c.latitude;G.lon=c.longitude;G.h=c.altitude||0;G.hrms=c.accuracy||9;G.vrms=c.altitudeAccuracy||G.hrms*1.5;
      G.fix=1;G.sats=0;G.vel=c.speed||0;if(c.heading!=null&&!isNaN(c.heading))G.course=c.heading;atualizaEN();R.ultimo=Date.now();
    });
    S.conectado=true;S.fonte="celular";S.desde=Date.now();render();toast("Usando o GPS do celular (precisão de metros)");
  }catch(e){toast("GPS do celular indisponível: "+(e.message||e))}
}
async function desconectarReal(){
  try{if(S.fonte==="tcp")await NP.GnssTcp.disconnect();if(S.fonte==="celular"&&R.geoId)await NP.Geolocation.clearWatch({id:R.geoId})}catch(e){}
  try{if(S.corrLigada)await NP.GnssTcp.ntripDisconnect()}catch(e){}
}

// ---------- NTRIP ----------
async function ntripLigar(){
  if(S.fonte!=="tcp")toast("Sem receptor: vou só testar o acesso ao caster. A correção não é aplicada.");
  if(!S.caster||!S.mount){toast("Preencha o caster e o ponto de montagem");return false}
  await NP.GnssTcp.ntripConnect({host:S.caster.trim(),port:parseInt(S.cport)||2101,mount:S.mount.trim(),user:S.user||"",pass:S.senha||""});
  R.ggaEnv=0;return true;
}
async function buscarMounts(){
  if(!NATIVO){toast("A busca de pontos de montagem funciona no app instalado");return}
  toast("Buscando pontos de montagem…");
  try{
    const r=await NP.GnssTcp.ntripSourcetable({host:S.caster.trim(),port:parseInt(S.cport)||2101,user:S.user||"",pass:S.senha||""});
    const ms=r.text.split(/\r?\n/).filter(l=>l.startsWith("STR;")).map(l=>{const c=l.split(";");const lat=+c[9],lon=+c[10];
      const d=(S.conectado&&!isNaN(lat))?Math.hypot((lat-G.lat)*111.32,(lon-G.lon)*111.32*Math.cos(G.lat*Math.PI/180)):NaN;return {m:c[1],cid:c[2],fmt:c[3],d}});
    ms.sort((a,b)=>(isNaN(a.d)?1e9:a.d)-(isNaN(b.d)?1e9:b.d));R.mounts=ms.slice(0,40);render();
    toast(ms.length?`${ms.length} pontos de montagem encontrados`:"Nenhum ponto de montagem na lista");
  }catch(e){toast("Não consegui ler a lista: "+(e.message||e))}
}

// ---------- servidor NMEA ----------
async function servidorReal(ligar){
  try{
    if(ligar){const r=await NP.GnssTcp.startServer({port:parseInt(S.sport)||5017});R.srvIps=r.ips||[];S.servidor=true;toast("Servidor ligado na porta "+S.sport)}
    else{await NP.GnssTcp.stopServer();S.servidor=false;R.clientes=[];toast("Servidor desligado")}
  }catch(e){toast("Servidor: "+(e.message||e))}
  render();
}

// ---------- exportar e compartilhar ----------
async function compartilharArquivo(){
  if(!exportTxt){toast("Gere o arquivo primeiro");return}
  const ext=exportTxt.startsWith("<?xml")?"kml":exportTxt.includes("SECTION")?"dxf":"csv";
  const nome=(proj()?.nome||"projeto").replace(/[^\w\-]+/g,"_")+"."+ext;
  try{
    const w=await NP.Filesystem.writeFile({path:nome,data:exportTxt,directory:"CACHE",encoding:"utf8"});
    await NP.Share.share({title:nome,text:nome,files:[w.uri],dialogTitle:"Enviar "+nome});
  }catch(e){if(!String(e.message||e).includes("cancel"))toast("Não consegui compartilhar: "+(e.message||e))}
}

// ---------- ouvintes ----------
if(NATIVO&&NP.GnssTcp){
  NP.GnssTcp.addListener("data",d=>onDados(d.text));
  NP.GnssTcp.addListener("status",s=>{
    if(s.kind==="desconectado"&&S.fonte==="tcp"&&S.conectado){S.conectado=false;S.corrLigada=false;bip("erro");toast("Receptor desconectado: "+(s.msg||""));render()}
  });
  NP.GnssTcp.addListener("ntrip",n=>{
    R.ntripBytes=n.bytes;const ant=R.ntripSt;R.ntripSt=n.status;R.ntripMsg=n.msg;
    if(n.status==="erro"){S.corrLigada=false;bip("erro");toast("NTRIP: "+n.msg);render()}
    else if(n.status==="recebendo"&&ant!=="recebendo")toast("NTRIP recebendo correção de "+n.msg);
  });
  NP.GnssTcp.addListener("clients",c=>{R.clientes=c.list||[];render(false)});
}
// envia a posição (GGA) ao caster a cada 10 s, exigido em redes VRS
setInterval(()=>{if(NATIVO&&S.corrLigada&&S.correcao==="ntrip"&&S.enviaGGA&&R.ultGGA&&Date.now()-R.ggaEnv>10000){R.ggaEnv=Date.now();NP.GnssTcp.ntripGGA({line:R.ultGGA}).catch(()=>{})}},2000);

function podeColetar(){return S.conectado&&!S.coletando&&(S.fonte==="celular"||!S.soFix||G.fix===4)}
function tickReal(now){
  if(S.fonte==="tcp"&&now-R.ultimo>5000)G.fix=0;
  if(G.prevFix===4&&G.fix!==4){bip("fix");toast("Atenção: perdeu o FIX")}
  if(G.prevFix!==4&&G.fix===4&&G.prevFix!==undefined&&S.cfg.somFix)bip("ok");
  G.prevFix=G.fix;
  if(S.est.gravando&&+S.est.duracao>0&&(now-S.est.inicio)/60000>=+S.est.duracao)pararEstatico(true);
  render(false);
}

render();
</script>
